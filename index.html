<!DOCTYPE html>
<html>

<head>
    <title>Model Setup</title>

    <style>
        .top-header {
            background: white;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        .search-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
            margin-bottom: 25px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f8fafc;
            height: 100vh;
        }

        /* LOGIN PAGE */

        #loginSection {
            display: flex;
            height: 100vh;
        }

        .login-left {
            width: 40%;
            background: linear-gradient(135deg, #0057AE, #0078D4);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
        }

        .welcome {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .login-left h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .subtitle {
            margin-bottom: 30px;
            font-size: 18px;
        }

        .login-left input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #0078D4;
            font-weight: bold;
            cursor: pointer;
        }

        .report-card {

            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 4px 12px rgba(0, 0, 0, .08);

        }

        .report-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-top: 20px;
        }

        .login-btn:hover {
            background: #f2f2f2;
        }

        #loginMessage {
            margin-top: 15px;
            color: #ffd7d7;
        }

        /* APPLICATION */

        #appSection {
            display: none;
            height: 100vh;
        }

        /* 
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg,
                    #6366F1,
                    #8B5CF6);
            color: white;
            height: 100vh;
        } */

        .sidebar {

            width: 260px;

            background:
                linear-gradient(180deg,
                    #0B1F4D,
                    #102E73);

            color: white;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            padding: 20px;
        }

        .menu-item {
            padding: 15px 20px;
            margin: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: .3s;
        }

        .menu-item:hover {
            background: #0a6ed1;
        }

        .active-menu {

            background:
                rgba(255, 255, 255, .12);

            color: white;

            border-left:
                4px solid #60A5FA;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            padding: 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        .stat-card h2 {
            margin-bottom: 10px;
        }

        .total {
            background: #EFF6FF;
        }

        .success {
            background: #ECFDF5;
        }

        .warning {
            background: #FFFBEB;
        }

        .danger {
            background: #FEF2F2;
        }

        .content {
            flex: 1;
            padding: 30px;
            background: #f4f6f9;
            overflow: auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }

        input[type=text] {
            width: 350px;
            padding: 12px;
            border: 1px solid #dbeafe;
            border-radius: 10px;
        }

        .search-btn {
            background: #6366F1;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
        }

        .search-btn:hover {
            background: #0854a0;
        }

        .result-table {
            width: 80%;
            max-width: 900px;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        .result-table tr {
            height: 70px;
        }

        .result-table tbody tr:hover {
            background: #F8FAFC;
        }

        .result-table th {
            background: #EEF2FF;
            color: #4338CA;
            font-weight: 600;
            text-align: center;
            padding: 15px;
        }

        .result-table td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: center;
            vertical-align: middle;
        }

        .result-table th:first-child,
        .result-table td:first-child {
            text-align: left;
            padding-left: 20px;
        }

        .result-table th:not(:first-child),
        .result-table td:not(:first-child) {
            text-align: center;
        }

        .result-table a {
            color: #4F46E5;
            font-weight: 600;
            text-decoration: none;
        }

        .result-table a:hover {
            color: #4338CA;
            text-decoration: underline;
        }

        .result-table th:first-child {
            border-top-left-radius: 16px;
        }

        .result-table th:last-child {
            border-top-right-radius: 16px;
        }

        .result-table button {
            min-width: 90px;
        }

        .result-table a:hover {
            text-decoration: underline;
        }

        /* 
        .logout-btn {

            background: #FECACA;
            color: #991B1B;

            border: none;
            padding: 10px 20px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 600;

        }

        .logout-btn:hover {

            background: #FCA5A5;

        } */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg,
                    #6366F1,
                    #8B5CF6);
            color: white;
            height: 100vh;

            display: flex;
            flex-direction: column;
        }

        .logout-sidebar {
            margin-top: auto;
            padding: 20px;
        }

        .sidebar-logout-btn {

            width: 100%;

            background: #FECACA;
            color: #991B1B;

            border: none;

            padding: 12px;

            border-radius: 12px;

            cursor: pointer;

            font-weight: 600;

            transition: .3s;
        }

        .sidebar-logout-btn:hover {

            background: #FCA5A5;

        }

        .no-data {
            background: #FEE2E2;
            color: #DC2626;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->

    <div id="loginSection">

        <div class="login-left">

            <div class="welcome">
                Welcome To
            </div>

            <h1>Model Setup</h1>

            <div class="subtitle">
                SAP Model Setup Platform
            </div>

            <form onsubmit="login(); return false;">

                <input type="text" id="username" placeholder="SAP Username">

                <input type="password" id="password" placeholder="SAP Password">

                <button type="submit" class="login-btn">
                    Sign In
                </button>

            </form>

            <p id="loginMessage"></p>

        </div>

    </div>

    <!-- APPLICATION -->

    <div id="appSection">

        <div class="sidebar">

            <!-- <div class="logo">
                📦
            </div> -->

            <div class="menu-item active-menu" onclick="showPage('dashboard',this)">
                📊 Dashboard
            </div>
            <div class="menu-item" onclick="showPage('modelReport',this)">
                📋 Model Report
            </div>
            <div class="menu-item" onclick="showPage('newModel',this)">
                ⚙️ Model Setup
            </div>
            <div class="menu-item" onclick="showPage('modelChange',this)">
                🔄 Model Change
            </div>

            <div class="logout-sidebar">
                <button class="sidebar-logout-btn" onclick="logout()">
                    🚪 Logout
                </button>
            </div>
            <!-- <div class="menu-item" onclick="showPage('editModel',this)">
                    ✏️ Edit Model Setup
                </div> -->

        </div>

        <div class="content">
            <div class="top-header">

                <div>
                    <h2>
                        Brother Readiness Validation Center
                    </h2>

                    <p>
                        SAP Model Readiness & Master Data Validation
                    </p>
                </div>



            </div>
            <!-- Dashboard -->

            <div id="dashboard" class="page active">
                <div id="dashboardContent">
                    <h1>Dashboard</h1>

                    <div class="stats-grid">

                        <div class="stat-card total">
                            <h2>120</h2>
                            <p>Total Models</p>
                        </div>

                        <div class="stat-card success">
                            <h2>97</h2>
                            <p>Completed</p>
                        </div>

                        <div class="stat-card warning">
                            <h2>18</h2>
                            <p>Pending</p>
                        </div>

                        <div class="stat-card danger">
                            <h2>5</h2>
                            <p>Issues</p>
                        </div>
                    </div>
                    <div class="search-card">

                        <div class="form-group">

                            <label>Model</label>

                            <input type="text" id="model">

                        </div>

                        <div class="form-group">

                            <label>Country</label>

                            <input type="text" id="country">

                        </div>

                        <button class="search-btn" onclick="searchModel()">
                            Search
                        </button>

                    </div>
                </div>
                <div id="detailsContent"></div>
            </div>


            <!-- New Model -->
            <!-- 
                <div id="newModel" class="page">

                    <h1>New Model Setup</h1>

                    <p>Create Model UI Here</p>

                </div> -->

            <!-- Edit Model -->

            <!-- <div id="editModel" class="page">

                    <h1>Edit Model Setup</h1>

                    <p>Edit Model UI Here</p>

                </div> -->

        </div>

    </div>

    <script>
        async function logout() {

            try {

                await fetch("/logout");

                document.getElementById(
                    "appSection"
                ).style.display = "none";

                document.getElementById(
                    "loginSection"
                ).style.display = "flex";

                // Clear login fields
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";

                // Clear dashboard search fields
                document.getElementById("model").value = "";
                document.getElementById("country").value = "";

                // Clear search result area
                const resultDiv =
                    document.getElementById("result");

                if (resultDiv) {
                    resultDiv.innerHTML = "";
                }


                if (resultDiv) {
                    resultDiv.innerHTML = "";
                }

            }
            catch (error) {

                alert("Logout Failed");

            }
        }
        function showPage(pageId, element) {

            document
                .querySelectorAll(".page")
                .forEach(page =>
                    page.classList.remove("active"));

            document
                .querySelectorAll(".menu-item")
                .forEach(item =>
                    item.classList.remove("active-menu"));

            document
                .getElementById(pageId)
                .classList.add("active");

            element.classList.add("active-menu");
        }

        async function login() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            try {

                const response =
                    await fetch("/login", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username,
                            password
                        })

                    });

                const data =
                    await response.json();

                if (data.success) {

                    document.getElementById(
                        "loginSection"
                    ).style.display = "none";

                    document.getElementById(
                        "appSection"
                    ).style.display = "flex";

                }
                else {

                    document.getElementById(
                        "loginMessage"
                    ).innerHTML =
                        data.message ||
                        "Login Failed";
                }

            }
            catch (error) {

                document.getElementById(
                    "loginMessage"
                ).innerHTML =
                    error.message;
            }
        }
        function loadSearchValues() {

            const params =
                new URLSearchParams(window.location.search);

            const model =
                params.get("model");

            const country =
                params.get("country");

            if (model) {
                document.getElementById("model").value = model;
            }

            if (country) {
                document.getElementById("country").value = country;
            }
        }
        loadSearchValues();
        async function searchModel() {

            const model =
                document.getElementById("model").value;

            const country =
                document.getElementById("country").value;

            try {

                const response =
                    await fetch(
                        `/api/model?model=${model}&country=${country}`
                    );

                const data =
                    await response.json();

                const results =
                    data.d.results;

                if (!results || results.length === 0) {

                    document.getElementById("result").innerHTML = `
                <div class="no-data">
                    No data found
                </div>
            `;

                    return;
                }

                const firstRecord = results[0];

                // window.location.href =
                //     `details.html?matnr=${firstRecord.Matnr}&country=${firstRecord.Country}`;


                loadModelDetails(firstRecord);

            }
            catch (error) {

                document.getElementById("result").innerHTML =
                    error.message;
            }
        }
        function loadModelDetails(r) {

            document.getElementById(
                "dashboardContent"
            ).style.display = "none";

            document.getElementById(
                "detailsContent"
            ).innerHTML = `

<iframe
    src="details.html?matnr=${r.Matnr}&country=${r.Country}"
    width="100%"
    height="1400px"
    style="
        border:none;
        border-radius:18px;
        background:white;
    ">
</iframe>

`;

        }

    </script>

</body>

</html>
