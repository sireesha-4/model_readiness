<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Setup</title>
    <link rel="stylesheet" href="modelsetup.css">

</head>

<body>

    <div class="setup-page">

        <div class="page-header">
            <h2>Model Setup - Create New Printer Model</h2>
            <div id="stepText">Step 1 of 5</div>
        </div>

        <div class="stepper">
            <div class="step active" id="step1">
                <div class="circle">1</div>
                <div>Model Related</div>
            </div>

            <div class="step" id="step2">
                <div class="circle">2</div>
                <div>Price Setup</div>
            </div>

            <div class="step" id="step3">
                <div class="circle">3</div>
                <div>Warranty Setup</div>
            </div>

            <div class="step" id="step4">
                <div class="circle">4</div>
                <div>Compatibility</div>
            </div>
            <div class="step" id="step5">
                <div class="circle">5</div>
                <div>Order Types</div>
            </div>
            <div class="step" id="step6">
                <div class="circle">6</div>
                <div>Review</div>
            </div>
        </div>
        <div class="wizard-progress">
            <div class="wizard-progress-fill" id="wizardProgress">
            </div>
        </div>
        <div id="contentArea"></div>
    </div>
    <script src="modelsetup.js"></script>
