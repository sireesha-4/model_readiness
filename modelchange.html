<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Model Change</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: transparent;
            color: #e2e8f0;
            height: auto;
            margin: 0;
            padding: 24px;
            min-height: auto;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 100%;
            min-height: auto;
            overflow: visible;
        }

        .report-header {
            margin-bottom: 20px;
        }

        .report-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 4px;
        }

        .report-header p {
            font-size: 13px;
            color: #94a3b8;
        }

        .report-search-card {
            background: #162238;
            border: 1px solid #243b55;
            border-radius: 16px;
            padding: 20px 22px;
            margin-bottom: 20px;
            display: flex;
            gap: 14px;
            align-items: end;
            flex-wrap: wrap;
        }

        .report-search-card .form-field {
            flex: 1;
            min-width: 180px;
        }

        .report-search-card label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .report-search-card input {
            width: 100%;
            padding: 11px 14px;
            background: #0f1c2e;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 13.5px;
            outline: none;
            box-sizing: border-box;
        }

        .report-search-card input:focus {
            border-color: #2563eb;
        }

        .report-search-card select {
            width: 100%;
            padding: 11px 14px;
            background: #0f1c2e;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 13.5px;
            outline: none;
            appearance: auto;
        }

        .report-search-card select:focus {
            border-color: #2563eb;
        }

        .report-search-actions {
            display: flex;
            gap: 10px;
        }

        .btn-search {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;

            display: flex;
            align-items: center;
            gap: 8px;
        }


        .btn-search:hover {
            background: #1d4ed8;
        }

        .btn-reset {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 13.5px;
            cursor: pointer;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, .05);
            color: #e2e8f0;
        }

        /* building blcks */
        .change-section {
            background: #162238;
            border: 1px solid #243b55;
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 12px;
        }

        .change-section:hover {
            border-color: #2f6df6;
        }

        .change-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .change-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .change-content {
            min-height: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 12px;
            padding-top: 12px;
        }

        .edit-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(37, 99, 235, .12);

            display: flex;
            align-items: center;
            justify-content: center;

            color: #60a5fa;
            cursor: pointer;
            transition: .2s ease;
        }

        .edit-icon:hover {
            background: #2563eb;
            color: white;
        }

        .edit-icon.save-mode {
            color: #22c55e;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(37, 99, 235, .12);

            display: flex;
            align-items: center;
            justify-content: center;

            color: #60a5fa;
            cursor: pointer;
            transition: .2s ease;
        }

        .toggle-icon:hover {
            background: #2563eb;
            color: #fff;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .info-field {
            display: flex;
            flex-direction: column;
        }

        .info-field label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .info-field input {
            width: 100%;
            height: 34px;
            padding: 0 12px;
            background: #0f1c2e;
            border: 1px solid #64748b;
            /* normal border */
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            outline: none;

            transition: border-color 0.2s ease;
        }

        .info-field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        @media(max-width:1200px) {
            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:768px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        .display-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-label {
            font-size: 12px;
            color: #94a3b8;
        }

        .field-value {
            font-size: 15px;
            color: #e6ecf1;
            font-weight: 500;
            min-height: 24px;
            display: block;
        }

        .info-field select {
            width: 100%;
            height: 34px;
            padding: 0 12px;
            background: #0f1c2e;
            border: 1px solid #64748b;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .info-field select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }


        .switch {
            position: relative;
            display: inline-block;
            width: 56px;
            height: 30px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #374151;
            transition: .3s;
            border-radius: 30px;
        }

        .slider:before {
            position: absolute;
            content: "";
            width: 22px;
            height: 22px;
            left: 4px;
            bottom: 4px;
            background: white;
            transition: .3s;
            border-radius: 50%;
        }

        .switch input:checked+.slider {
            background: #159a15;
        }

        .switch input:checked+.slider:before {
            transform: translateX(26px);
        }

        .toggle-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .order-row {
            display: grid;
            grid-template-columns: 250px 300px;
            gap: 40px;
            align-items: center;
        }

        .toggle-grid .info-field {
            display: grid;

            grid-template-columns:
                170px 70px;

            align-items: center;

            column-gap: 24px;
        }

        .toggle-grid .info-field label {
            margin: 0;
            font-size: 13px;
        }

        .toggle-grid .switch {
            margin: 0;
        }

        .switch-wrapper {
            display: flex;
            align-items: center;
        }

        .review-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .btn-review {
            background: #f59e0b;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-review:hover {
            background: #d97706;
        }

        /* ===== Warranty number + unit group ===== */
        .warranty-group {
            display: flex;
            gap: 8px;
            align-items: center;
            max-width: 220px;
        }

        .warranty-number {
            flex: 0 0 90px;
            min-width: 90px;
            max-width: 110px;
            height: 34px;
            padding: 0 10px;
            background: #0f1c2e;
            border: 1px solid #64748b;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        .warranty-unit {
            flex: 0 0 100px;
            min-width: 100px;
            height: 34px;
            padding: 0 8px;
            background: #0f1c2e;
            border: 1px solid #64748b;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        .warranty-number:disabled,
        .warranty-unit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #1e293b;
            color: #94a3b8;
        }

        .warranty-number:focus,
        .warranty-unit:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        /* ===== Country-based dimmed warranty rows ===== */
        .warranty-row-disabled {
            opacity: 0.45;
            pointer-events: none;
            filter: grayscale(0.6);
        }

        .warranty-row-disabled .switch,
        .warranty-row-disabled input,
        .warranty-row-disabled select {
            cursor: not-allowed !important;
        }

        .warranty-row-disabled .field-value,
        .warranty-row-disabled label {
            color: #64748b !important;
        }

        /* ===== 3-column Warranty Grid ===== */
        .warranty-grid {
            display: grid;
            grid-template-columns: 200px 240px 320px;
            /* Toggle | Length | Material */
            gap: 18px 24px;
            align-items: start;
            justify-content: start;
        }

        .warranty-grid .info-field {
            min-width: 0;
        }

        /* Toggle column – keep compact */
        .warranty-grid .info-field:nth-child(3n + 1) {
            max-width: 200px;
        }

        /* Length column – number + unit side by side */
        .warranty-grid .info-field:nth-child(3n + 2) .warranty-group,
        .warranty-grid .info-field:nth-child(3n + 2) .field-value {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Material column – fixed width, no stretch */
        .warranty-grid .info-field:nth-child(3n) input,
        .warranty-grid .info-field:nth-child(3n) .field-value {
            width: 100%;
            max-width: 320px;
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .warranty-grid {
                grid-template-columns: 180px 220px 280px;
            }
        }

        @media (max-width: 900px) {
            .warranty-grid {
                grid-template-columns: 1fr 1fr;
            }

            .warranty-grid .info-field:nth-child(3n) {
                grid-column: 1 / -1;
                /* Material takes full width on medium screens */
            }
        }

        @media (max-width: 600px) {
            .warranty-grid {
                grid-template-columns: 1fr;
            }
        }

        .warranty-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: block;
            font-weight: 500;
        }

        .review-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;

            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(10px);
            align-items: center;
            display: flex;
            justify-content: center;
            overflow: hidden;

            z-index: 2147483647;
        }

        .review-content {
            width: 980px;
            max-width: 95%;
            max-height: 85vh;

            background:
                radial-gradient(circle at top left,
                    rgba(37, 99, 235, .18),
                    #020817 65%);

            border: 1px solid rgba(59, 130, 246, .45);
            border-radius: 22px;

            padding: 28px;

            overflow: hidden;
        }

        .review-header {

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 18px;
        }

        .review-title {
            display: flex;
            align-items: center;
            gap: 18px;

            color: #178eb6;

            font-size: 24px;
            font-weight: 700;

            text-shadow:
                0 0 4px rgba(34, 199, 255, .25);
        }


        .review-title i {
            font-size: 48px;
            color: #178eb6;
        }

        .review-close-icon {

            background: transparent;
            border: none;

            color: #94a3b8;

            font-size: 28px;

            cursor: pointer;
        }

        .review-close-icon:hover {
            color: #ffffff;
        }

        .review-divider {

            height: 1px;

            margin-bottom: 20px;

            background:
                linear-gradient(to right,
                    transparent,
                    #3b82f6,
                    transparent);
        }

        .review-table {

            width: 100%;
            border-collapse: collapse;
            overflow: hidden;

            border-radius: 14px;
        }

        .review-table th {

            background:
                linear-gradient(180deg,
                    rgba(37, 99, 235, .22),
                    rgba(15, 23, 42, .95));

            color: #dbeafe;

            padding: 16px 14px;

            text-align: left;

            font-size: 14px;

            border: 1px solid rgba(59, 130, 246, .2);
        }

        .review-table td {

            padding: 14px;

            color: #e2e8f0;

            border: 1px solid rgba(59, 130, 246, .15);
        }

        .review-table tr:hover {

            background:
                rgba(37, 99, 235, .05);
        }

        .before-value {
            color: #cbd5e1;
            text-align: center;
        }

        .after-value {
            color: #f8fafc;
            font-weight: 600;
            text-align: center;
        }

        .yes-value {
            color: #4ade80;
        }

        .no-value {
            color: #ef4444;
        }

        .status-cell {
            text-align: center;
            vertical-align: middle;
        }

        .status-yes {
            color: #57e37d;
            font-size: 28px;

        }

        .status-no {
            color: #ff4d4f;
            font-size: 28px;
        }

        .review-close-btn:hover {

            background: #2563eb;

            box-shadow:
                0 0 10px rgba(59, 130, 246, .6),
                0 0 20px rgba(59, 130, 246, .3);
        }

        .category-cell {

            width: 220px;

            font-weight: 700;

            color: #f8fafc;

            vertical-align: middle;

            line-height: 1.5;

            background:
                rgba(37, 99, 235, .08);
        }

        .status-yes {
            color: #4ade80;
            font-size: 22px;
        }

        .status-no {
            color: #ef4444;
            font-size: 22px;
        }

        .review-actions {
            flex-shrink: 0;

            margin-top: 16px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .review-save-btn {

            min-width: 220px;
            height: 48px;

            border: none;
            border-radius: 10px;

            background: #0e6f31;

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            box-shadow: none;

            transition: background .2s ease;
        }

        .review-save-btn:hover {
            background: #0e6f31;
            transform: translateY(-2px);
        }

        .review-save-btn:active {

            transform: translateY(0);
        }

        .review-table-wrapper {
            max-height: 420px;

            overflow-y: auto;
            overflow-x: hidden;

            border-radius: 14px;
        }

        .review-table-wrapper::-webkit-scrollbar {
            width: 8px;
        }

        .review-table-wrapper::-webkit-scrollbar-track {
            background: #07101f;
            border-radius: 10px;
        }

        .review-table-wrapper::-webkit-scrollbar-thumb {
            background: #2563eb;
            border-radius: 10px;
        }

        .review-table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }

        .review-table thead th {

            position: sticky;

            top: 0;

            z-index: 2;
        }

        .pricing-layout {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px 30px;
        }

        .pricing-layout .info-field {
            display: flex !important;
            flex-direction: column;
            align-items: flex-start;
        }

        .toggle-grid.pricing-layout {
            display: grid !important;
            grid-template-columns: 220px 220px 120px;
            gap: 20px 16px;
        }

        .toggle-grid.pricing-layout .field-value {
            width: 100%;
        }


        .toggle-grid.pricing-layout .info-field {
            display: flex !important;
            flex-direction: column;
            gap: 8px;
        }

        .pricing-sub-block {
            margin-top: 16px;
            padding: 16px;
            background: #0f1c2e;
            border: 1px solid #334155;
            border-radius: 10px;
        }

        .pricing-sub-block-title {
            font-size: 14px;
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #334155;
        }

        .pricing-details {
            margin-top: 16px;
        }

        .pricing-details.hidden {
            display: none;
        }

        .material-readonly {
            background: #0f1c2e;
            color: #ffffff;
            cursor: not-allowed;
        }

        .material-readonly:focus {
            outline: none;
        }

        .quick-country-select {
            width: 100%;
            height: 46px;

            padding: 0 14px;

            border: 1px solid #31465f;
            border-radius: 9px;

            background: rgba(8, 24, 42, 0.88);

            color: #dbeafe;

            font-size: 13px;

            outline: none;

            cursor: pointer;
        }


        .quick-country-select option {
            background: #0f1c2e;
            color: #ffffff;
        }

        input[type="date"] {
            color: #ffffff;
            color-scheme: dark;
        }

        input[type="date"]::-webkit-calendar-picker-inddicator {
            cursor: pointer;
            filter: invert(1);
        }

        /* ===== Compatibility Layout ===== */
        /* ===== Compatibility Layout ===== */
        .compatibility-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 50px;
            align-items: start;
        }

        .compatibility-left {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .compatibility-right {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* ===== Custom Checkboxes (Blue tick when checked) ===== */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .checkbox-item input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #64748b;
            border-radius: 4px;
            background: #0f1c2e;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .checkbox-item input[type="checkbox"]:checked {
            background: #2563eb;
            /* Blue background when checked */
            border-color: #2563eb;
        }

        .checkbox-item input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 13px;
            font-weight: 700;
            line-height: 1;
        }

        .checkbox-item input[type="checkbox"]:disabled {
            opacity: 0.85;
            cursor: default;
        }

        .checkbox-item label {
            font-size: 14px;
            color: #e2e8f0;
            cursor: pointer;
            user-select: none;
        }

        /* ===== Side by side fields - shorter width ===== */
        .side-by-side-fields {
            display: flex;
            gap: 20px;
            margin-top: 6px;
        }

        .side-by-side-fields .info-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 180px;
            /* ← shorter fixed width */
        }

        .side-by-side-fields .info-field .field-value,
        .side-by-side-fields .info-field input {
            width: 180px !important;
            max-width: 180px;
        }

        .compatibility-readonly {
            pointer-events: none !important;
        }

        .compatibility-readonly .switch {
            pointer-events: none !important;
        }

        .compatibility-readonly .slider {
            cursor: not-allowed !important;
        }

        .required {
            color: #908f8f;
            font-weight: 700;
        }

        input:disabled,
        select:disabled,
        .switch input:disabled,
        .switch input:disabled+.slider {
            cursor: not-allowed !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header (words unchanged) -->
        <div class="report-header">
            <h1>Model Update</h1>
            <p>Search and update model configuration details.</p>
        </div>

        <!-- Search Section - now matches Model Report -->
        <div class="report-search-card">

            <div class="form-field">
                <label>Model <span class="required">*</span></label>
                <input type="text" id="changeModelSearch" placeholder="e.g. DCPL2550DW">
            </div>

            <!-- <div class="form-field">
        <label>Country</label>
        <input type="text" id="changeCountrySearch" placeholder="e.g. US">
      </div> -->

            <div class="form-field">

                <label>
                    Country <span class="required">*</span>
                </label>

                <select id="country" class="quick-country-select">

                    <option value="US">
                        United States
                    </option>

                    <option value="CA">
                        Canada
                    </option>


                </select>

            </div>

            <div class="form-field">
                <label>Search Type</label>

                <select id="searchType">
                    <option value="full">Full Details</option>
                    <option value="material">Material Info</option>
                    <option value="warranty">Warranty Info</option>
                    <option value="compatibility">Model Compatibility</option>

        function toggleBarracudaRightColumn(toggle) {
            const section = toggle.closest(".change-content");
            const rightColumn = section.querySelector(".compatibility-right");

            if (rightColumn) {
                rightColumn.style.display = toggle.checked ? "block" : "none";
            }
        }

        async function loadModelChange() {
            console.log("Search button clicked");

            const model =
                document.getElementById("changeModelSearch")
                    .value.trim();

            const country =
                document.getElementById("country")
                    .value.trim();

            const searchType =
                document.getElementById("searchType").value;

            console.log("Model:", model);
            console.log("Country:", country);

            if (!model || !country) {
                alert("Please enter Model, Country and Flag");
                return;
            }
            try {
                const response = await fetch(
                    `/api/model/get?model=${encodeURIComponent(model)}&country=${encodeURIComponent(country)}`
                );

                console.log("API called");
                const data = await response.json();
                console.log("Response:", data);
                const record = data.d;
                console.log("FIRST RECORD");
                console.log(record);

                if (!record) {

                    document.getElementById("modelChangeResult")
                        .innerHTML =
                        "<div>No data found</div>";
                    return;
                }

                originalData =
                    JSON.parse(JSON.stringify(record));

                hasChanges = false;
                changedFields = [];

                const oldBtn =
                    document.getElementById("reviewChangesBtn");

                if (oldBtn) {
                    oldBtn.remove();
                }
                showChangeBlocks(record, searchType);
            }
            catch (error) {
                console.error("Search Error:", error);
                alert(error.message || "Search failed");
            }
        }
        function resetModelChange() {

            document.getElementById(
                "changeModelSearch"
            ).value = "";

            document.getElementById(
                "country"
            ).value = "US";

            document.getElementById(
                "searchType"
            ).value = "full";

            document.getElementById(
                "modelChangeResult"
            ).innerHTML = "";
        }

        function enableEdit(icon) {

            const section = icon.closest(".change-section");
            const sectionName = section.querySelector("h3").innerText;

            // =====================================================
            // SPECIAL CASE: Order Type
            // =====================================================
            if (sectionName === "Order Type") {

                if (!section.dataset.originalValues) {
                    const fields = section.querySelectorAll(".info-field");
                    const values = [];
                    const keys = [];

                    fields.forEach(f => {
                        const label = f.querySelector("label")?.innerText?.trim() || "";
                        let value = "-";

                        const toggleField = f.querySelector('input[type="checkbox"]');
                        const valueField = f.querySelector(".field-value");

                        if (toggleField) {
                            value = toggleField.checked ? "Yes" : "No";
                        } else if (valueField) {
                            value = valueField.innerText?.trim() || "-";
                        }

                        keys.push("-||" + label);
                        values.push(value);
                    });

                    section.dataset.originalKeys = JSON.stringify(keys);
                    section.dataset.originalValues = JSON.stringify(values);
                }

                const toggle = section.querySelector(".toggle-icon");
                if (toggle) toggle.style.display = "none";

                // Enable all order toggles
                const toggles = section.querySelectorAll('.switch-wrapper input[type="checkbox"]');
                toggles.forEach(t => {
                    t.disabled = false;
                    // Attach the live handler so turning ON/OFF updates the consumable field
                    t.onchange = function () {
                        handleOrderToggle(this);
                    };
                });

                // Convert Consumable fields according to current toggle state
                const orderMap = {
                    "Drum Order": "Drum Order Consumable",
                    "Waste Toner": "Waste Toner Consumable",
                    "Belt Unit": "Belt Unit Consumable",
                    "Backup Order": "Backup Order Consumable"
                };

                Object.keys(orderMap).forEach(toggleLabel => {
                    const consumableLabel = orderMap[toggleLabel];

                    // Find the toggle
                    const toggleInput = Array.from(section.querySelectorAll('input[type="checkbox"]'))
                        .find(inp => {
                            const lbl = inp.closest(".info-field")?.querySelector("label")?.innerText?.trim();
                            return lbl === toggleLabel;
                        });

                    if (!toggleInput) return;

                    // Find the consumable field
                    const consumableField = Array.from(section.querySelectorAll(".info-field"))
                        .find(f => f.querySelector("label")?.innerText?.trim() === consumableLabel);

                    if (!consumableField) return;

                    const valueSpan = consumableField.querySelector(".field-value");
                    const currentValue = valueSpan ? (valueSpan.innerText === "-" ? "" : valueSpan.innerText) : "";

                    if (toggleInput.checked) {
                        // Toggle is ON → make consumable editable
                        if (valueSpan) {
                            valueSpan.outerHTML = `<input type="text" value="${currentValue}" class="order-consumable-input">`;
                        }
                    } else {
                        // Toggle is OFF → keep as display "-"
                        if (valueSpan) {
                            valueSpan.innerText = "-";
                        }
                    }
                });

                icon.innerHTML = '<i class="fas fa-check"></i>';
                icon.onclick = function () { saveSection(this); };
                return;
            }
            function handleOrderToggle(toggle) {
                const section = toggle.closest(".change-section");
                if (!section) return;

                const toggleLabel = toggle.closest(".info-field")?.querySelector("label")?.innerText?.trim();
                if (!toggleLabel) return;

                const orderMap = {
                    "Drum Order": "Drum Order Consumable",
                    "Waste Toner": "Waste Toner Consumable",
                    "Belt Unit": "Belt Unit Consumable",
                    "Backup Order": "Backup Order Consumable"
                };

                const consumableLabel = orderMap[toggleLabel];
                if (!consumableLabel) return;

                const consumableField = Array.from(section.querySelectorAll(".info-field"))
                    .find(f => f.querySelector("label")?.innerText?.trim() === consumableLabel);

                if (!consumableField) return;

                const existingInput = consumableField.querySelector("input.order-consumable-input");
                const existingSpan = consumableField.querySelector(".field-value");

                if (toggle.checked) {
                    // Turned ON → make editable
                    const currentVal = existingSpan
                        ? (existingSpan.innerText === "-" ? "" : existingSpan.innerText)
                        : (existingInput ? existingInput.value : "");

                    if (existingSpan) {
                        existingSpan.outerHTML = `<input type="text" value="${currentVal}" class="order-consumable-input">`;
                    } else if (existingInput) {
                        existingInput.disabled = false;
                    }
                } else {
                    // Turned OFF → force back to "-"
                    if (existingInput) {
                        existingInput.outerHTML = `<span class="field-value">-</span>`;
                    } else if (existingSpan) {
                        existingSpan.innerText = "-";
                    }
                }
            }

            // =====================================================
            // NORMAL SECTIONS (including Warranty)
            // =====================================================

            // These toggles must ALWAYS stay disabled
            const nonEditableToggles = [
                // "Amazon Dart",
                // "Consumable",
                // "Barracuda",
                // "Brother Plus",
                // "Model Price Setup",
                // "Consumable Price Setup"
            ];

            // Apply country dimming first
            if (sectionName === "Warranty Information") {
                applyCountryWarrantyRestrictions();
            }

            // Enable / disable toggles
            section.querySelectorAll('input[type="checkbox"]').forEach(toggle => {
                const label = toggle.closest(".info-field")?.querySelector("label")?.innerText?.trim();

                // Keep permanently non-editable ones disabled
                if (nonEditableToggles.includes(label)) {
                    toggle.disabled = true;
                    return;
                }

                // For Warranty section → respect country restriction
                if (sectionName === "Warranty Information") {
                    const warrantyKey = toggle.closest(".info-field")?.dataset?.warranty;
                    if (warrantyKey && !isWarrantyAllowed(warrantyKey)) {
                        toggle.disabled = true;               // stay disabled + dimmed
                    } else {
                        toggle.disabled = false;              // allow editing
                    }
                } else {
                    toggle.disabled = false;
                }
            });

            // Expand section if collapsed
            const content = section.querySelector(".change-content");
            const toggleBtn = section.querySelector(".toggle-icon");

            if (content.style.display === "none") {
                content.style.display = "block";
                if (toggleBtn) {
                    toggleBtn.querySelector("i").className = "fas fa-chevron-up";
                }
            }

            // Snapshot original values (only once)
            if (!section.dataset.originalValues) {
                const fields = section.querySelectorAll(".info-field");
                const values = [];
                const keys = [];

                fields.forEach(f => {
                    const label = f.querySelector("label")?.innerText?.trim() || "";
                    let value = "-";

                    const valueField = f.querySelector(".field-value");
                    const toggleField = f.querySelector('input[type="checkbox"]');

                    if (toggleField) {
                        value = toggleField.checked ? "Yes" : "No";
                    } else if (valueField) {
                        value = valueField.innerText?.trim() || "-";
                    }

                    let sub = "-";
                    const subBlock = f.closest(".pricing-sub-block");
                    if (subBlock) {
                        sub = subBlock.querySelector(".pricing-sub-block-title")?.innerText?.trim() || "-";
                    }

                    keys.push(sub + "||" + label);
                    values.push(value);
                });

                section.dataset.originalValues = JSON.stringify(values);
                section.dataset.originalKeys = JSON.stringify(keys);
            }

            // Hide the expand/collapse icon while editing
            const toggle = section.querySelector(".toggle-icon");
            if (toggle) toggle.style.display = "none";

            // =====================================================
            // Convert display fields → editable controls
            // =====================================================
            const displayFields = section.querySelectorAll(".field-value");

            const readOnlyFields = [
                "Plant", "Material Type", "Industry Sector", "Material Group",
                "Base Unit of Measure", "Division", "Language",
                "Material Description", "Distribution Channel", "Consumable"
            ];

            const displayOnlyFields = [
                "Material Number",
                "Country",
                "Plant",
                "Material Type",
                "Industry Sector",
                "Material Group",
                "Base Unit of Measure",
                "Division",
                "Cross Plant Status",
                "Cross Distribution Status",
                "Language",
                "Material Description",
                "Distribution Channel",
                "Distribution Material Status",
                "Konda",
                "Sales Organization",
                "Condition Type",
                "Consumable",
                // SKUs stay as display-only (managed by handleWarrantyToggle)
                "Standard Warranty SKU", "Extended Warranty SKU",
                "BrotherCare SKU", "BrotherPlus SKU" ,
                 "Valid From",
                "Valid To"
            ];

            const yesNoFields = [
                "Amazon Dart", "Auto Reorder", "Barracuda", "Brother Plus",
                "Model Price Setup", "Consumable Price Setup",
                "Basic", "Occasional", "Moderate", "Frequent", "High", "Power",
                "Backup Order", "Drum Order", "Waste Toner", "Belt Unit"
            ];

            const consumableFields = [
                "Drum Order Consumable", "Waste Toner Consumable",
                "Belt Unit Consumable", "Backup Order Consumable"
            ];

            displayFields.forEach(field => {

                const value = field.innerText === "-" ? "" : field.innerText;
                const label = field.closest(".info-field")?.querySelector("label")?.innerText?.trim();

                if (!label) return;

                // ---------- Display-only fields (never become inputs) ----------
                if (displayOnlyFields.includes(label)) {
                    field.classList.add("display-only");
                    return;
                }

                // ---------- WARRANTY LENGTH FIELDS ----------
                // We deliberately do NOT convert them here.
                // handleWarrantyToggle is the single source of truth.
                if (
                    label === "Standard Warranty Length" ||
                    label === "Extended Warranty Length" ||
                    label === "BrotherCare Warranty Length" ||
                    label === "BrotherPlus Warranty Length"
                ) {
                    // Leave as-is. handleWarrantyToggle will manage them.
                    return;
                }

                // ---------- Yes/No toggles ----------
                if (yesNoFields.includes(label)) {

                    const checked = value === "Yes" ? "checked" : "";

                    const readOnlyCompatibilityFields = [

                    ];

                    const disabledAttr = readOnlyCompatibilityFields.includes(label) ? "disabled" : "";
                    const styleAttr = readOnlyCompatibilityFields.includes(label) ? 'style="pointer-events:none;"' : "";

                    field.outerHTML = `
        <div class="switch-wrapper">
          <label class="switch" ${styleAttr}>
            <input type="checkbox"
                   ${checked}
                   ${disabledAttr}
                   data-toggle-label="${label}"
                   onchange="togglePricingBlock(this,'${label}')">
            <span class="slider"></span>
          </label>
        </div>
      `;
                    return;
                }

                // ---------- Consumable fields ----------
                if (consumableFields.includes(label)) {
                    field.outerHTML = `
        <span class="field-value consumable-display"
              data-consumable-field="${label}">
          ${value || "-"}
        </span>
      `;
                    return;
                }

                // ---------- Date fields ----------
                if (label === "Valid From" || label === "Valid To") {
                    let dateValue = "";
                    if (value && value !== "-") {
                        const [day, month, year] = value.split("/");
                        dateValue = `${year}-${month}-${day}`;
                    }
                    field.outerHTML = `<input type="date" value="${dateValue}">`;
                    return;
                }

                // ---------- Normal text fields ----------
                const isReadOnlyField = readOnlyFields.includes(label);

                if (isReadOnlyField) {
                    field.outerHTML = `
        <input type="text"
               value="${value}"
               readonly
               class="material-readonly">
      `;
                } else {
                    field.outerHTML = `<input type="text" value="${value}">`;
                }
            });

            // Change icon to save mode
            icon.innerHTML = '<i class="fas fa-check"></i>';
            icon.onclick = function () {
                saveSection(this);
            };

            // =====================================================
            // After converting fields – force warranty rows to correct state
            // =====================================================
            if (sectionName === "Warranty Information") {

                // Re-apply country dimming (important)
                applyCountryWarrantyRestrictions();

                // For every warranty toggle that is currently ON → make length editable
                section.querySelectorAll('input[data-toggle-label]').forEach(toggle => {
                    if (toggle.disabled) return;               // skip dimmed ones

                    // Call our new handler so the length/SKU are correctly set up
                    handleWarrantyToggle(toggle);
                });
            }


        }

        function togglePricingBlock(toggle, label) {

            const section =
                toggle.closest(".change-content");



            if (!section) return;

            if (label === "Barracuda") {

                const block =
                    section.querySelector("#barracudaDetails");

                if (block) {

                    block.style.display =
                        toggle.checked ? "block" : "none";
                }
            }

            if (label === "Model Price Setup") {

                const block =
                    section.querySelector("#b1PricingDetails");

                if (block) {
                    block.style.display =
                        toggle.checked ? "block" : "none";
                }
            }

            if (label === "Consumable Price Setup") {

                const block =
                    section.querySelector("#brPricingDetails");

                if (block) {
                    block.style.display =
                        toggle.checked ? "block" : "none";
                }
            }
        }
        function markAsChanged() {

            if (hasChanges) return;

            hasChanges = true;

            showReviewButton();
        }
        function showReviewButton() {

            const existing =
                document.getElementById("reviewChangesBtn");

            if (existing) return;

            document
                .getElementById("modelChangeResult")
                .insertAdjacentHTML(
                    "beforeend",
                    `
      <div class="review-container">

        <button
    id="reviewChangesBtn"
    class="btn-review"
    onclick="reviewChanges()">

    <i class="fas fa-eye"></i>
    Review Changes

</button>

      </div>
      `
                );
        }
        function reviewChanges() {

            if (changedFields.length === 0) {

                alert("No changes found.");

                return;
            }
            console.log("changedFields =", changedFields);

            showReviewPopup(changedFields);
        }
        function showReviewPopup(changes) {
            if (changes.length === 0) {
                alert("No changes detected.");
                return;
            }

            // Build the modal HTML (same as before)
            let html = `
    <div class="review-modal" id="modelChangeReviewModal">
      <div class="review-content">
        <div class="review-header">
          <div class="review-title">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Review Changes</span>
          </div>
          <button class="review-close-icon" onclick="window.parent.closeModelChangeReview()">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="review-divider"></div>
        <div class="review-table-wrapper">
          <table class="review-table">
            <thead>
              <tr>
                <th>Category</th>
                <th>Sub Category</th>   <!-- NEW -->
                <th>Field</th>
                <th>Before</th>
                <th>After</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
  `;

            // Group: section → subCategory → items
            const grouped = {};

            changes.forEach(change => {
                const section = change.section;
                const sub = change.subCategory || "-";

                if (!grouped[section]) grouped[section] = {};
                if (!grouped[section][sub]) grouped[section][sub] = [];
                grouped[section][sub].push(change);
            });

            Object.keys(grouped).forEach(section => {
                const subGroups = grouped[section];
                const subKeys = Object.keys(subGroups);

                // total rows in this section (for Category rowspan)
                let sectionRowCount = 0;
                subKeys.forEach(sub => {
                    sectionRowCount += subGroups[sub].length;
                });

                let sectionFirstRow = true;

                subKeys.forEach(sub => {
                    const items = subGroups[sub];
                    const subRowCount = items.length;

                    items.forEach((change, index) => {
                        html += `<tr>`;

                        // Category – only on the first row of the whole section
                        if (sectionFirstRow) {
                            html += `
          <td rowspan="${sectionRowCount}" class="category-cell">
            ${section}
          </td>
        `;
                            sectionFirstRow = false;
                        }

                        // Sub Category – only on the first row of this sub group
                        if (index === 0) {
                            html += `
          <td rowspan="${subRowCount}" class="category-cell">
            ${sub}
          </td>
        `;
                        }

                        html += `
        <td>${change.field}</td>
        <td class="before-value">${change.before}</td>
        <td class="${change.after === "Yes" ? "after-value yes-value" :
                                change.after === "No" ? "after-value no-value" : "after-value"
                            }">
          ${change.after}
        </td>
        <td class="status-cell">
          ${change.after === "No"
                                ? '<i class="fa-regular fa-circle-xmark status-no"></i>'
                                : '<i class="fa-regular fa-circle-check status-yes"></i>'
                            }
        </td>
      </tr>`;
                    });
                });
            });
            html += `
            </tbody>
          </table>
        </div>
        <div class="review-actions">
          <button class="review-save-btn" onclick="window.parent.saveModelChangeFromReview()">
            <i class="fas fa-floppy-disk"></i>
            Save Changes
          </button>
        </div>
      </div>
    </div>
  `;

            // Inject styles into parent if they are not already present
            injectReviewStylesToParent();

            // Append modal to the PARENT document

            window.parent.document.body.insertAdjacentHTML("beforeend", html);

            // Prevent background scrolling
            window.parent.document.body.style.overflow = "hidden";
            const parentContent = window.parent.document.querySelector(".content");
            if (parentContent) {
                parentContent.style.overflowY = "hidden";
            }
        }

        function isWarrantyAllowed(warrantyKey) {
            const country = getCountry();
            // CA → SW, EW, BC only
            // US → SW, EW, BP only
            if (warrantyKey === "BrotherCare") return country === "CA";
            if (warrantyKey === "BrotherPlus") return country === "US";
            return true; // Standard & Extended always allowed
        }

        function applyCountryWarrantyRestrictions() {
            const country = getCountry();

            // BrotherCare – only for CA
            const bcFields = document.querySelectorAll('[data-warranty="BrotherCare"]');
            bcFields.forEach(f => {
                if (country === "US") {

                }

        }

        function getWarrantySku(type, length) {
            const len = parseInt(length, 10);
            if (!len || isNaN(len)) return "";

            if (type === "Standard Warranty") {
                if (len === 1) return "BMGST_1";
                if (len === 2) return "BMGST_2";
            }
            if (type === "Extended Warranty") {
                if (len === 1) return "E1141EPSP";
                if (len === 2) return "E1142EPSP";
            }
            if (type === "BrotherCare Warranty") {
                return "BCARE_6MTHS";
            }
            if (type === "BrotherPlus Warranty") {
                return "BPLUS_6MTHS";
            }
            return "";
        }
        function validateSwEwTotal() {
            // Find the two length inputs
            const swGroup = document.querySelector('.warranty-group[data-warranty="Standard Warranty"]');
            const ewGroup = document.querySelector('.warranty-group[data-warranty="Extended Warranty"]');

            // Clear previous errors first
            document.querySelectorAll(".warranty-error").forEach(el => el.remove());

            if (!swGroup && !ewGroup) return true; // nothing to validate

            let swVal = 0;
            let ewVal = 0;

            if (swGroup) {
                const input = swGroup.querySelector(".warranty-number");
                swVal = parseInt(input?.value || "0", 10) || 0;
            }
            if (ewGroup) {
                const input = ewGroup.querySelector(".warranty-number");
                ewVal = parseInt(input?.value || "0", 10) || 0;
            }

            // Only validate when both are ON (both groups exist)
            if (!swGroup || !ewGroup) return true;

            const total = swVal + ewVal;

            if (total !== 3) {
                // Show error under both rows
                const msg = `Standard + Extended must total 3 years (currently ${swVal} + ${ewVal} = ${total})`;

                [swGroup, ewGroup].forEach(group => {
                    const field = group.closest(".info-field");
                    if (field && !field.querySelector(".warranty-error")) {
                        const err = document.createElement("span");
                        err.className = "warranty-error";
                        err.innerText = msg;
                        field.appendChild(err);
                    }
                });
                return false;
            }

            // Also enforce the exact combinations you asked for
            // (SW=1 → EW must be 2)  or  (SW=2 → EW must be 1)
            if (!((swVal === 1 && ewVal === 2) || (swVal === 2 && ewVal === 1))) {
                const msg = `Allowed combinations only: SW=1 + EW=2  or  SW=2 + EW=1`;

                [swGroup, ewGroup].forEach(group => {
                    const field = group.closest(".info-field");
                    if (field && !field.querySelector(".warranty-error")) {
                        const err = document.createElement("span");
                        err.className = "warranty-error";
                        err.innerText = msg;
                        field.appendChild(err);
                    }
                });
                return false;
            }

            return true;
        }

        function handleWarrantyToggle(toggle) {
            const label = toggle.dataset.toggleLabel;
            const isOn = toggle.checked;

            const infoField = toggle.closest(".info-field");
            const lengthField = infoField.nextElementSibling;
            const skuField = lengthField?.nextElementSibling;

            if (!lengthField || !skuField) return;

            // ===== TURNED OFF → clear everything =====
            if (!isOn) {
                if (lengthField.querySelector(".warranty-group") || lengthField.querySelector(".field-value")) {
                    lengthField.innerHTML = `
        <label>${lengthField.querySelector("label").innerText}</label>
        <span class="field-value">-</span>
      `;
                }

                const skuSpan = skuField.querySelector(".field-value") || skuField.querySelector("input");
                if (skuSpan) {
                    if (skuSpan.tagName === "INPUT") {
                        skuSpan.value = "";
                        skuSpan.disabled = true;
                    } else {
                        skuSpan.innerText = "-";
                    }
                }
                return;
            }

            // ===== TURNED ON =====
            const isEditMode = !!document.querySelector(".change-section .edit-icon .fa-check");

            if (isEditMode) {

                // Preserve existing length value if present (from span or already-editable group)
                let existingNum = "";
                let existingUnit = "YR";
                const existingSpan = lengthField.querySelector(".field-value");
                const existingGroup = lengthField.querySelector(".warranty-group");
                if (existingSpan && existingSpan.innerText && existingSpan.innerText !== "-") {
                    const parts = existingSpan.innerText.trim().split(/\s+/);
                    existingNum = parts[0] || "";
                    existingUnit = parts[1] || "YR";
                } else if (existingGroup) {
                    existingNum = existingGroup.querySelector(".warranty-number")?.value || "";
                    existingUnit = existingGroup.querySelector(".warranty-unit")?.value || "YR";
                }

                // Preserve existing SKU value if present
                let existingSku = "";
                const existingSkuSpan = skuField.querySelector(".field-value");
                const existingSkuInput = skuField.querySelector("input.warranty-sku-input, input[type='text']");
                if (existingSkuSpan && existingSkuSpan.innerText && existingSkuSpan.innerText !== "-") {
                    existingSku = existingSkuSpan.innerText.trim();
                } else if (existingSkuInput && existingSkuInput.value) {
                    existingSku = existingSkuInput.value.trim();
                }

                const isFixedMonth = (label === "BrotherCare Warranty" || label === "BrotherPlus Warranty");

                let defaultNum = existingNum || "0";
                let defaultUnit = existingUnit || "YR";

                if (isFixedMonth) {
                    defaultNum = "6";
                    defaultUnit = "MO";
                }

                // ---------- BrotherCare / BrotherPlus ----------
                if (isFixedMonth) {
                    lengthField.innerHTML = `
<label>${lengthField.querySelector("label").innerText}</label>
<span class="field-value">6 MO</span>
`;
                }
                // ---------- Standard / Extended ----------
                else {
                    lengthField.innerHTML = `
<label>${lengthField.querySelector("label").innerText}</label>
<div class="warranty-group" data-warranty="${label}">
<input class="warranty-number" type="number" min="0" max="2"
   value="${defaultNum}"
   oninput="clampWarrantyLength(this); updateWarrantySku(this); validateSwEwTotal();">
  <select class="warranty-unit" onchange="updateWarrantySku(this); validateSwEwTotal();">
    <option value="YR" ${defaultUnit === "YR" ? "selected" : ""}>YR</option>
  </select>
</div>
`;
                }

                // SKU – prefer existing value, fall back to auto-generated
                const skuLabel = skuField.querySelector("label").innerText;
                const autoSku = getWarrantySku(label, defaultNum);
                const skuToUse = existingSku || autoSku || "";

                if (label === "Standard Warranty" || label === "Extended Warranty") {
                    skuField.innerHTML = `
  <label>${skuLabel}</label>
  <input type="text" class="warranty-sku-input" value="${skuToUse}">
`;
                } else {
                    skuField.innerHTML = `
  <label>${skuLabel}</label>
  <span class="field-value">${skuToUse || "-"}</span>
`;
                }
            }
        }

        function updateWarrantySku(el) {
            const group = el.closest(".warranty-group");
            if (!group) return;

            const type = group.dataset.warranty; // "Standard Warranty" etc.
            const numberInput = group.querySelector(".warranty-number");
            const unitSelect = group.querySelector(".warranty-unit");

            const length = numberInput?.value || "";
            const sku = getWarrantySku(type, length);

            // Find the SKU field (next sibling of length field)
            const lengthField = group.closest(".info-field");
            const skuField = lengthField?.nextElementSibling;

            if (skuField) {
                const span = skuField.querySelector(".field-value");
                const input = skuField.querySelector("input.warranty-sku-input");

                if (span) span.innerText = sku || "-";
                if (input) input.value = sku || "";
            }
        }

        function toggleWarrantyLength(toggleElement, warrantyType) {

            const infoField = toggleElement.closest(".info-field");

            const lengthFieldContainer = infoField.nextElementSibling;
            const skuFieldContainer = lengthFieldContainer?.nextElementSibling;

            if (!lengthFieldContainer) return;

            const numberInput =
                lengthFieldContainer.querySelector(".warranty-number");

            const unitSelect =
                lengthFieldContainer.querySelector(".warranty-unit");

            const skuInput =
                skuFieldContainer?.querySelector("input");

            const isEnabled = toggleElement.checked;

            // Enable / Disable Length
            if (numberInput) {
                numberInput.disabled = !isEnabled;
            }

            if (unitSelect) {
                unitSelect.disabled = !isEnabled;
            }

            // Enable / Disable SKU
            if (skuInput) {
                skuInput.disabled = !isEnabled;
            }

            // Toggle OFF
            if (!isEnabled) {

                if (numberInput) numberInput.value = "";

                if (unitSelect) {
                    unitSelect.value = "YR";
                }

                if (skuInput) {
                    skuInput.value = "";
                }
            }

            // Toggle ON
            else {

                // only apply defaults if there is no value

                if (numberInput && !numberInput.value) {

                    if (
                        warrantyType === "BrotherCare Warranty" ||
                        warrantyType === "BrotherPlus Warranty"
                    ) {

                        numberInput.value = 6;

                        if (unitSelect) {
                            unitSelect.value = "MO";
                        }

                    } else {

                        numberInput.value = 0;

                        if (unitSelect) {
                            unitSelect.value = "YR";
                        }
                    }
                }
            }
        }


        function convertToODataDate(dateValue) {

            if (!dateValue || dateValue === "-") {
                return null;
            }

            let day, month, year;

            if (dateValue.includes("/")) {

                [day, month, year] = dateValue.split("/");

            } else if (dateValue.includes("-")) {

                [year, month, day] = dateValue.split("-");
            } else {

                return null;
            }

            const date = new Date(
                Number(year),
                Number(month) - 1,
                Number(day)
            );

            return `/Date(${date.getTime()})/`;
        }
