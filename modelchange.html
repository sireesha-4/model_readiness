<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Model Change</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: transparent;
      color: #e2e8f0;
      height: auto;
      margin: 0;
      padding: 24px;
      min-height: auto;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 100%;
      min-height: auto;
      overflow: visible;
    }

    .report-header {
      margin-bottom: 20px;
    }

    .report-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .report-header p {
      font-size: 13px;
      color: #94a3b8;
    }

    .report-search-card {
      background: #162238;
      border: 1px solid #243b55;
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 20px;
      display: flex;
      gap: 14px;
      align-items: end;
      flex-wrap: wrap;
    }

    .report-search-card .form-field {
      flex: 1;
      min-width: 180px;
    }

    .report-search-card label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .report-search-card input {
      width: 100%;
      padding: 11px 14px;
      background: #0f1c2e;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 13.5px;
      outline: none;
      box-sizing: border-box;
    }

    .report-search-card input:focus {
      border-color: #2563eb;
    }

    .report-search-card select {
      width: 100%;
      padding: 11px 14px;
      background: #0f1c2e;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 13.5px;
      outline: none;
      appearance: auto;
    }

    .report-search-card select:focus {
      border-color: #2563eb;
    }

    .report-search-actions {
      display: flex;
      gap: 10px;
    }

    .btn-search {
      background: #2563eb;
      color: white;
      border: none;
      padding: 11px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 8px;
    }


    .btn-search:hover {
      background: #1d4ed8;
    }

    .btn-reset {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 13.5px;
      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, .05);
      color: #e2e8f0;
    }

    /* building blcks */
    .change-section {
      background: #162238;
      border: 1px solid #243b55;
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 12px;
    }

    .change-section:hover {
      border-color: #2f6df6;
    }

    .change-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .change-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .change-content {
      min-height: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      margin-top: 12px;
      padding-top: 12px;
    }

    .edit-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(37, 99, 235, .12);

      display: flex;
      align-items: center;
      justify-content: center;

      color: #60a5fa;
      cursor: pointer;
      transition: .2s ease;
    }

    .edit-icon:hover {
      background: #2563eb;
      color: white;
    }

    .edit-icon.save-mode {
      color: #22c55e;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(37, 99, 235, .12);

      display: flex;
      align-items: center;
      justify-content: center;

      color: #60a5fa;
      cursor: pointer;
      transition: .2s ease;
    }

    .toggle-icon:hover {
      background: #2563eb;
      color: #fff;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .info-field {
      display: flex;
      flex-direction: column;
    }

    .info-field label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .info-field input {
      width: 100%;
      height: 34px;
      padding: 0 12px;
      background: #0f1c2e;
      border: 1px solid #64748b;
      /* normal border */
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      outline: none;

      transition: border-color 0.2s ease;
    }

    .info-field input:focus {
      border-color: #ffffff;
    }

    @media(max-width:1200px) {
      .info-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width:768px) {
      .info-grid {
        grid-template-columns: 1fr;
      }
    }

    .display-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-size: 12px;
      color: #94a3b8;
    }

    .field-value {
      font-size: 15px;
      color: #e6ecf1;
      font-weight: 500;
      min-height: 24px;
      display: block;
    }

    .info-field select {
      width: 100%;
      height: 34px;
      padding: 0 12px;
      background: #0f1c2e;
      border: 1px solid #64748b;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .info-field select:focus {
      border-color: #ffffff;
    }

    .warranty-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .warranty-number {
      flex: 0 0 100px;
      min-width: 220px;
    }

    .warranty-unit {
      flex: 0 0 90px;
      min-width: 90px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 30px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #374151;
      transition: .3s;
      border-radius: 30px;
    }

    .slider:before {
      position: absolute;
      content: "";
      width: 22px;
      height: 22px;
      left: 4px;
      bottom: 4px;
      background: white;
      transition: .3s;
      border-radius: 50%;
    }

    .switch input:checked+.slider {
      background: #159a15;
    }

    .switch input:checked+.slider:before {
      transform: translateX(26px);
    }

    .toggle-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .toggle-grid .info-field {
      display: grid;

      grid-template-columns:
        170px 70px;

      align-items: center;

      column-gap: 24px;
    }

    .toggle-grid .info-field label {
      margin: 0;
      font-size: 13px;
    }

    .toggle-grid .switch {
      margin: 0;
    }

    .switch-wrapper {
      display: flex;
      align-items: center;
    }

    .review-container {
      display: flex;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .btn-review {
      background: #f59e0b;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-review:hover {
      background: #d97706;
    }

    .warranty-number:disabled,
    .warranty-unit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #1e293b;
      color: #94a3b8;
    }

    .warranty-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px 28px;
      align-items: start;
    }

    @media(max-width:768px) {
      .warranty-grid {
        grid-template-columns: 1fr;
      }
    }

    .warranty-grid .info-field:first-child,
    .warranty-grid .info-field:nth-child(3),
    .warranty-grid .info-field:nth-child(5),
    .warranty-grid .info-field:nth-child(7) {
      max-width: 220px;
    }

    .review-modal {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(10px);

      display: flex;
      justify-content: center;
      align-items: center;

      z-index: 99999;
    }

    .review-content {

      width: 980px;
      max-width: 95%;

      background:
        radial-gradient(circle at top left,
          rgba(37, 99, 235, 0.18),
          #020817 65%);

      border: 1px solid rgba(59, 130, 246, 0.45);

      border-radius: 22px;

      padding: 28px;

      box-shadow:
        0 0 10px rgba(96, 165, 250, .5),
        0 0 25px rgba(59, 130, 246, .35),
        0 0 60px rgba(59, 130, 246, .15);
    }

    .review-header {

      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 18px;
    }

    .review-title {
      display: flex;
      align-items: center;
      gap: 18px;

      color: #178eb6;

      font-size: 24px;
      font-weight: 700;

      text-shadow:
        0 0 4px rgba(34, 199, 255, .25);
    }


    .review-title i {
      font-size: 48px;
      color: #178eb6;
    }

    .review-close-icon {

      background: transparent;
      border: none;

      color: #94a3b8;

      font-size: 28px;

      cursor: pointer;
    }

    .review-close-icon:hover {
      color: #ffffff;
    }

    .review-divider {

      height: 1px;

      margin-bottom: 20px;

      background:
        linear-gradient(to right,
          transparent,
          #3b82f6,
          transparent);
    }

    .review-table {

      width: 100%;
      border-collapse: collapse;
      overflow: hidden;

      border-radius: 14px;
    }

    .review-table th {

      background:
        linear-gradient(180deg,
          rgba(37, 99, 235, .22),
          rgba(15, 23, 42, .95));

      color: #dbeafe;

      padding: 16px 14px;

      text-align: left;

      font-size: 14px;

      border: 1px solid rgba(59, 130, 246, .2);
    }

    .review-table td {

      padding: 14px;

      color: #e2e8f0;

      border: 1px solid rgba(59, 130, 246, .15);
    }

    .review-table tr:hover {

      background:
        rgba(37, 99, 235, .05);
    }

    .before-value {
      color: #cbd5e1;
      text-align: center;
    }

    .after-value {
      color: #f8fafc;
      font-weight: 600;
      text-align: center;
    }

    .yes-value {
      color: #4ade80;
    }

    .no-value {
      color: #ef4444;
    }

    .status-cell {
      text-align: center;
      vertical-align: middle;
    }

    .status-yes {
      color: #57e37d;
      font-size: 28px;

    }

    .status-no {
      color: #ff4d4f;
      font-size: 28px;
    }
    .review-close-btn:hover {

      background: #2563eb;

      box-shadow:
        0 0 10px rgba(59, 130, 246, .6),
        0 0 20px rgba(59, 130, 246, .3);
    }

    .category-cell {

      width: 220px;

      font-weight: 700;

      color: #f8fafc;

      vertical-align: middle;

      line-height: 1.5;

      background:
        rgba(37, 99, 235, .08);
    }

    .status-yes {
      color: #4ade80;
      font-size: 22px;
    }

    .status-no {
      color: #ef4444;
      font-size: 22px;
    }

    .review-actions {
      margin-top: 24px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .review-save-btn {

      min-width: 220px;
      height: 48px;

      border: none;
      border-radius: 10px;

      background: #0e6f31;

      color: white;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      box-shadow: none;

      transition: background .2s ease;
    }

    .review-save-btn:hover {
      background: #0e6f31;
      transform: translateY(-2px);
    }

    .review-save-btn:active {

      transform: translateY(0);
    }

    .review-table-wrapper {

      max-height: 420px;

      overflow-y: auto;

      overflow-x: hidden;

      border-radius: 14px;
    }

    .review-table-wrapper::-webkit-scrollbar {
      width: 8px;
    }

    .review-table-wrapper::-webkit-scrollbar-track {
      background: #07101f;
      border-radius: 10px;
    }

    .review-table-wrapper::-webkit-scrollbar-thumb {
      background: #2563eb;
      border-radius: 10px;
    }

    .review-table-wrapper::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }

    .review-table thead th {

      position: sticky;

      top: 0;

      z-index: 2;
    }

    .pricing-layout {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px 30px;
    }

    .pricing-layout .info-field {
      display: flex !important;
      flex-direction: column;
      align-items: flex-start;
    }

    .toggle-grid.pricing-layout {
      display: grid !important;
      grid-template-columns: 220px 220px 120px;
      gap: 20px 16px;
    }

    .toggle-grid.pricing-layout .field-value {
      width: 100%;
    }


    .toggle-grid.pricing-layout .info-field {
      display: flex !important;
      flex-direction: column;
      gap: 8px;
    }

    .pricing-sub-block {
      margin-top: 16px;
      padding: 16px;
      background: #0f1c2e;
      border: 1px solid #334155;
      border-radius: 10px;
    }

    .pricing-sub-block-title {
      font-size: 14px;
      font-weight: 600;
      color: #60a5fa;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }

    .pricing-details {
      margin-top: 16px;
    }

    .pricing-details.hidden {
      display: none;
    }

    .material-readonly {
      background: #0f1c2e;
      color: #ffffff;
      cursor: not-allowed;
    }

    .material-readonly:focus {
      outline: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header (words unchanged) -->
    <div class="report-header">
      <h1>Model Change</h1>
      <p>Search and update model configuration details.</p>
    </div>

    <!-- Search Section - now matches Model Report -->
    <div class="report-search-card">

      <div class="form-field">
        <label>Model</label>
        <input type="text" id="changeModelSearch" placeholder="e.g. DCPL2550DW">
      </div>

      <div class="form-field">
        <label>Country</label>
        <input type="text" id="changeCountrySearch" placeholder="e.g. US">
      </div>

      <div class="form-field">
        <label>Search Type</label>

        <select id="searchType">
          <option value="full">Full Details</option>
          <option value="material">Material Info</option>
          <option value="warranty">Warranty Info</option>
          <option value="compatibility">Model Compatibility</option>
          <option value="pricing">Pricing Info</option>
          <option value="order">Order Info</option>
        </select>
      </div>

      <div class="report-search-actions">

        <button class="btn-search" onclick="loadModelChange()">
          <i class="fas fa-search"></i>
          Search
        </button>

        <button class="btn-reset" onclick="resetModelChange()">
          <i class="fas fa-undo"></i>
          Reset
        </button>

      </div>

    </div>

    <div id="modelChangeResult"></div>
  </div>

  <script>

    let originalData = null;
    let hasChanges = false;
    let changedFields = [];
    let currentData = null;
    let sectionOriginalValues = {};

    const fieldMap = {
      "Material Number": "Matnr",
      "Country": "Country",
      "Plant": "Werks",
      "Material Type": "Mtart",
      "Industry Sector": "Mbrsh",
      "Material Group": "Matkl",
      "Base Unit of Measure": "Meins",
      "Division": "Spart",
      "Ean / UPC": "Ean11",

      "Cross Plant Status": "Mstae",
      "Cross Distribution Status": "Mstav",
      "Language": "Spras",
      "Material Description": "Maktx",
      "Distribution Channel": "Vtweg",
      "Distribution Material Status": "Vmsta",
      "StandardWarranty": "StdWtyType",
      "StandardwarrantyLength": "StdWtyLen",
      "StandardwarrantyUnit": "StdWtyLenUnit",
      "ExtendedWarranty": "ExtdWtyType",
      "ExtendedwarrantyLength": "ExtdWtyLen",
      "ExtendedwarrantyUnit": "ExtdWtyLenUnit",
      "BrothercareWarranty": "BcareWtyType",
      "BrothercarewarrantyLength": "BcareWtyLen",
      "BrothercarewarrantyUnit": "BcareWtyLenUnit",
      "BrotherplusWarranty": "BplusWtyType",
      "BrotherpluswarrantyLength": "BplusWtyLen",
      "BrotherpluswarrantyUnit": "BplusWtyLenUnit",
      "Amazon Dart": "Amazondart",
      "BR Refresh": "Brrefresh",
      "Barracuda": "Barracuda",
      "Brother Plus": "Bplus",
      "B1 Price Setup": "Selkzb1",
      "BR Price Setup": "Selkzbr",
      "B1 Material Price": "B1Amount",
      "B1 Currency": "B1Currency",
      "BR Material Price": "BRAmount",
      "BR Currency": "BRCurrency",
      "Consumable": "Consumable",
      "Drum Order": "DrumOrder",
      "Waste Toner": "WasteToner",
      "Belt Unit": "BeltUnit",
      "Claim Order": "Claimorder"

    };


    async function loadModelChange() {
      console.log("Search button clicked");

      const model =
        document.getElementById("changeModelSearch")
          .value.trim();

      const country =
        document.getElementById("changeCountrySearch")
          .value.trim();



      const searchType =
        document.getElementById("searchType").value;

      console.log("Model:", model);
      console.log("Country:", country);

      if (!model || !country) {
        alert("Please enter Model, Country and Flag");
        return;
      }
      try {
        const response = await fetch(
          `/api/model/get?model=${encodeURIComponent(model)}&country=${encodeURIComponent(country)}`
        );

        console.log("API called");
        const data = await response.json();
        console.log("Response:", data);
        const record = data.d;
        console.log("FIRST RECORD");
        console.log(record);

        if (!record) {

          document.getElementById("modelChangeResult")
            .innerHTML =
            "<div>No data found</div>";
          return;
        }

        originalData =
          JSON.parse(JSON.stringify(record));

        hasChanges = false;
        changedFields = [];

        const oldBtn =
          document.getElementById("reviewChangesBtn");

        if (oldBtn) {
          oldBtn.remove();
        }
        showChangeBlocks(record, searchType);
      }
      catch (error) {
        console.error("Search Error:", error);
        alert(error.message || "Search failed");
      }
    }
    function resetModelChange() {

      document.getElementById(
        "changeModelSearch"
      ).value = "";

      document.getElementById(
        "changeCountrySearch"
      ).value = "";

      document.getElementById(
        "searchType"
      ).value = "full";

      document.getElementById(
        "modelChangeResult"
      ).innerHTML = "";
    }

    function enableEdit(icon) {

      const section =
        icon.closest(".change-section");
      const sectionName =
        section.querySelector("h3").innerText;

      const isMaterialSection =
        sectionName === "Material Information";

      const content =
        section.querySelector(".change-content");

      const toggleBtn =
        section.querySelector(".toggle-icon");

      /* Expand section if collapsed */

      if (content.style.display === "none") {

        content.style.display = "block";

        toggleBtn.querySelector("i").className =
          "fas fa-chevron-up";
      }

      if (!section.dataset.originalValues) {

        section.dataset.originalValues =
          JSON.stringify(
            Array.from(
              section.querySelectorAll(".field-value")
            ).map(x => x.innerText)
          );

      }

      const toggle =
        section.querySelector(".toggle-icon");

      toggle.style.display = "none";

      const displayFields =
        section.querySelectorAll(".field-value");

      displayFields.forEach(field => {

        const value =
          field.innerText === "-"
            ? ""
            : field.innerText;

        const label = field.closest(".info-field").querySelector("label").innerText;

        const yesNoFields = [

          "StandardWarranty",
          "ExtendedWarranty",
          "BrothercareWarranty",
          "BrotherplusWarranty",

          "Amazon Dart",
          "BR Refresh",
          "Barracuda",
          "Brother Plus",

          "B1 Price Setup",
          "BR Price Setup",

          "Backup Order",
          "Drum Order",
          "Waste Toner",
          "Belt Unit",
          "Claim Order"

        ];

        const warrantyFields = [

          "StandardwarrantyLength",
          "ExtendedwarrantyLength",
          "BrothercarewarrantyLength",
          "BrotherpluswarrantyLength"

        ];
        if (warrantyFields.includes(label)) {

          let numValue = "";
          let unitValue = "YR";

          if (
            (label === "BrothercarewarrantyLength" ||
              label === "BrotherpluswarrantyLength") &&
            !value
          ) {
            numValue = 6;
            unitValue = "MONTH";
          }

          if (value) {

            const parts = value.split(" ");

            numValue = parts[0] || "";
            unitValue = parts[1] || "YR";
          }

          field.outerHTML = `
<div class="warranty-group"
     data-warranty="${label.replace('Length', '')}">

    <input
        class="warranty-number"
        type="number"
        min="0"
        value="${numValue}">

    <select class="warranty-unit">

        <option value="YR"
            ${unitValue === "YR" ? "selected" : ""}>
            YR
        </option>

        <option value="MONTH"
            ${unitValue === "MONTH" ? "selected" : ""}>
            Month
        </option>

    </select>

</div>
`;

    function saveSection(icon) {

      const section =
        icon.closest(".change-section");
      const toggle =
        section.querySelector(".toggle-icon");

      toggle.style.display = "flex";

      const warrantyGroups =
        section.querySelectorAll(".warranty-group");

      warrantyGroups.forEach(group => {

        const num =
          group.querySelector(".warranty-number").value;

        const unit =
          group.querySelector(".warranty-unit").value;

        const value =
          num
            ? `${num} ${unit}`
            : "-";

        group.outerHTML =
          `<span class="field-value">${value}</span>`;
      });

      const controls =
        section.querySelectorAll("input, select");

      controls.forEach(control => {
        if (control.type === "checkbox") {

          const value =
            control.checked
              ? "Yes"
              : "No";

          control.closest(".switch").outerHTML =
            `<span class="field-value">${value}</span>`;

          return;
        }

        const value =
          (control.value || "").trim() || "-";

        control.outerHTML =
          `<span class="field-value">${value}</span>`;
      });
      const originalValues =
        JSON.parse(
          section.dataset.originalValues || "[]"
        );

      const currentValues =
        Array.from(
          section.querySelectorAll(".field-value")
        ).map(x => x.innerText);

      const changed =
        JSON.stringify(originalValues) !==
        JSON.stringify(currentValues);

      if (changed) {

        const fields =
          section.querySelectorAll(".info-field");

        fields.forEach((field, index) => {

          const label =
            field.querySelector("label")?.innerText;

          const currentValue =
            field.querySelector(".field-value")?.innerText;

          const originalValue =
            originalValues[index];

          const sectionName =
            section.querySelector("h3").innerText;

          const existingIndex =
            changedFields.findIndex(x =>
              x.section === sectionName &&
              x.field === label
            );

          if (originalValue !== currentValue) {

            if (existingIndex > -1) {

              changedFields[existingIndex].after =
                currentValue;

            } else {

              changedFields.push({
                section: sectionName,
                field: label,
                before: originalValue,
                after: currentValue
              });

            }

          } else {

            if (existingIndex > -1) {

              changedFields.splice(
                existingIndex,
                1
              );

            }

          }

        });

        markAsChanged();

          if (change.field === "BrothercarewarrantyLength") {
            payload.BcareWtyLen = length;
            payload.BcareWtyLenUnit = unit;
          }

          if (change.field === "BrotherpluswarrantyLength") {
            payload.BplusWtyLen = length;

          }

          return;
        }

        payload[backendField] = value;

      });

    }
    function formatODataDate(dateStr) {

      if (!dateStr) return "-";

      const timestamp = parseInt(
        dateStr.match(/\d+/)[0]
      );

      const date = new Date(timestamp);

      return date.toLocaleDateString("en-GB");
    }
