        async function saveChanges() {

            console.log("originalData:", originalData);

            const changepayload = {};

            // -------------------------------------------------
            // 1. Always send Material Information + keys
            // -------------------------------------------------
            const materialFields = [
                "Matnr", "Country", "Werks", "Mtart", "Mbrsh", "Matkl",
                "Meins", "Spart", "Ean11", "Mstae", "Mstav", "Spras",
                "Maktx", "Vtweg", "Vmsta"
            ];

            materialFields.forEach(key => {
                changepayload[key] = originalData[key] ?? "";
            });

            // Always keep these two
            changepayload.Matnr = originalData.Matnr;
            changepayload.Country = originalData.Country;

            // -------------------------------------------------
            // 2. Initialise all Flags to empty
            // -------------------------------------------------
            changepayload.MaterialFlag = "";
            changepayload.PriceFlag = "";
            changepayload.WarrantyFlag = "";
            changepayload.OrdertypeFlag = "";
            changepayload.CompatableFlag = "";

            // -------------------------------------------------
            // 3. Only the fields that appear in Review Changes
            //    will be written into the payload below
            // -------------------------------------------------

            changedFields.forEach(change => {


                if (change.section === "Pricing Information") {

                    const pricingMap = {

                        "Model Price Details": {
                            "Model Price Setup": "Selkzb1",
                            "Material Price": "B1kbetr",
                            "Currency": "B1konwa",
                            "Pricing Unit": "B1kpein",
                            "Unit of Measure": "B1kmein",
                            "Unit Of Measure": "B1kmein",
                            "Calculation Type": "B1krech",
                            "Valid From": "B1datab",
                            "Valid To": "B1datbi"
                        },

                        "Consumable Price Details": {
                            "Consumable Price Setup": "Selkzbr",
                            "Material Price": "Brkbetr",
                            "Currency": "Brkonwa",
                            "Pricing Unit": "Brkpein",
                            "Customer Price Group": "Konda",
                            "Unit of Measure": "Brkmein",
                            "Unit Of Measure": "Brkmein",
                            "Calculation Type": "Brkrech",
                            "Valid From": "Brdatab",
                            "Valid To": "Brdatbi"
                        }

                    };

                    const backendField =
                        pricingMap[change.subCategory]?.[change.field];

                    if (backendField) {

                        let value = change.after;

                        // Toggle Conversion
                        if (value === "Yes") value = "X";
                        if (value === "No") value = "";

                        if (backendField === "B1standardwarr") {
                            value = Number(value);
                        }

                        if (
                            backendField === "B1datab" ||
                            backendField === "B1datbi" ||
                            backendField === "Brdatab" ||
                            backendField === "Brdatbi"
                        ) {

                            changepayload[backendField] =
                                value === "-"
                                    ? null
                                    : convertToODataDate(value);

                        } else {

                            changepayload[backendField] = value;
                        }


                        return;
                    }
                }



                const backendField = fieldMap[change.field];

                if (!backendField) {
                    console.warn("No mapping found:", change.field);
                    return;
                }

                let value = change.after;

                // Toggle Conversion
                if (value === "Yes") {
                    value = "X";
                } else if (value === "No") {
                    // Model Compatibility & Order Type → send '-' when toggle is OFF
                    if (change.section === "Model Compatibility" || change.section === "Order Type") {
                        value = "-";
                    } else {
                        value = "";
                    }
                }

                const warrantyTypeMap = {
                    StdWtyType: "S",
                    ExtdWtyType: "X",
                    BcareWtyType: "B",
                    BplusWtyType: "L"
                };

                if (Object.prototype.hasOwnProperty.call(warrantyTypeMap, backendField)) {
                    // Always send the type code (S / X / B / L) even when the toggle is OFF
                    value = warrantyTypeMap[backendField];
                }
                // Warranty Split
                if (
                    change.field === "Standard Warranty Length" ||
                    change.field === "Extended Warranty Length" ||
                    change.field === "BrotherCare Warranty Length" ||
                    change.field === "BrotherPlus Warranty Length"
                ) {

                    const [length, unit] = value.split(" ");

                    if (
                        change.field === "Standard Warranty Length" ||
                        change.field === "Extended Warranty Length" ||
                        change.field === "BrotherCare Warranty Length" ||
                        change.field === "BrotherPlus Warranty Length"
                    ) {
                        let length = "0";
                        let unit = "YR";

                        if (value && value !== "-" && value.trim() !== "") {
                            const parts = value.trim().split(/\s+/);
                            length = parts[0] || "0";
                            unit = parts[1] || "YR";
                        }

                        // Never send "-" to backend
                        if (length === "-" || length === "" || isNaN(parseInt(length, 10))) {
                            length = "0";
                        }

                        if (change.field === "Standard Warranty Length") {
                            changepayload.StdWtyLen = length;
                            changepayload.StdWtyLenUnit = unit === "-" ? "YR" : unit;
                        }

                        if (change.field === "Extended Warranty Length") {
                            changepayload.ExtdWtyLen = length;
                            changepayload.ExtdWtyLenUnit = unit === "-" ? "YR" : unit;
                        }

                        if (change.field === "BrotherCare Warranty Length") {
                            changepayload.BcareWtyLen = length;
                            changepayload.BcareWtyLenUnit = unit === "-" ? "MO" : unit;
                        }

                        if (change.field === "BrotherPlus Warranty Length") {
                            changepayload.BplusWtyLen = length;
                            changepayload.BplusWtyLenUnit = unit === "-" ? "MO" : unit;
                        }

                        return;
                    }
                }

                // -------------------------------------------------
                // Force the related Warranty Type whenever Length / SKU is changed
                // -------------------------------------------------
                const warrantyTypeForceMap = {
                    "Standard Warranty Length": { typeField: "StdWtyType", typeValue: "S" },
                    "Standard Warranty SKU": { typeField: "StdWtyType", typeValue: "S" },
                    "Extended Warranty Length": { typeField: "ExtdWtyType", typeValue: "X" },
                    "Extended Warranty SKU": { typeField: "ExtdWtyType", typeValue: "X" },
                    "BrotherCare Warranty Length": { typeField: "BcareWtyType", typeValue: "B" },
                    "BrotherCare SKU": { typeField: "BcareWtyType", typeValue: "B" },
                    "BrotherPlus Warranty Length": { typeField: "BplusWtyType", typeValue: "L" },
                    "BrotherPlus SKU": { typeField: "BplusWtyType", typeValue: "L" }
                };

                if (warrantyTypeForceMap[change.field]) {
                    const { typeField, typeValue } = warrantyTypeForceMap[change.field];
                    changepayload[typeField] = typeValue;
                }

                if (backendField === "B1standardwarr") {

                    let numericValue = parseInt(value, 10);

                    if (
                        value === "" ||
                        value === "-" ||
                        value == null ||
                        isNaN(numericValue)
                    ) {
                        numericValue = 0;
                    }

                    changepayload[backendField] = numericValue;

                    console.log(
                        "Converted B1standardwarr:",
                        value,
                        "-->",
                        numericValue,
                        typeof numericValue
                    );

                } else {

                    changepayload[backendField] = value;

                }
                // -------------------------------------------------
                // When any field of a warranty is changed,
                // force the full set (Type + Length + Unit + SKU) into the payload
                // -------------------------------------------------
                const warrantyGroupMap = {
                    "Standard Warranty": {
                        type: { field: "StdWtyType", value: "S" },
                        length: "StdWtyLen",
                        unit: "StdWtyLenUnit",
                        sku: "Swsku"
                    },
                    "Extended Warranty": {
                        type: { field: "ExtdWtyType", value: "X" },
                        length: "ExtdWtyLen",
                        unit: "ExtdWtyLenUnit",
                        sku: "Ewsku"
                    },
                    "BrotherCare Warranty": {
                        type: { field: "BcareWtyType", value: "B" },
                        length: "BcareWtyLen",
                        unit: "BcareWtyLenUnit",
                        sku: "Bcsku"
                    },
                    "BrotherPlus Warranty": {
                        type: { field: "BplusWtyType", value: "L" },
                        length: "BplusWtyLen",
                        unit: "BplusWtyLenUnit",
                        sku: "Bpsku"
                    }
                };

                // Detect which warranty group this change belongs to
                let warrantyKey = null;
                if (change.field.includes("Standard Warranty")) warrantyKey = "Standard Warranty";
                if (change.field.includes("Extended Warranty")) warrantyKey = "Extended Warranty";
                if (change.field.includes("BrotherCare")) warrantyKey = "BrotherCare Warranty";
                if (change.field.includes("BrotherPlus")) warrantyKey = "BrotherPlus Warranty";

                if (warrantyKey && warrantyGroupMap[warrantyKey]) {
                    const group = warrantyGroupMap[warrantyKey];

                    // Always force the Type
                    changepayload[group.type.field] = group.type.value;

                    // Force Length + Unit from current UI value (or original if not changed)
                    const lengthChange = changedFields.find(c => c.field === `${warrantyKey} Length`);
                    const lengthValue = lengthChange ? lengthChange.after :
                        (originalData[group.length] ? `${originalData[group.length]} ${originalData[group.unit] || "YR"}` : "0 YR");

                    let len = "0";
                    let uni = "YR";
                    if (lengthValue && lengthValue !== "-") {
                        const parts = lengthValue.trim().split(/\s+/);
                        len = parts[0] || "0";
                        uni = parts[1] || "YR";
                    }
                    if (len === "-" || isNaN(parseInt(len))) len = "0";
                    if (uni === "-") uni = (warrantyKey.includes("Brother") ? "MO" : "YR");

                    changepayload[group.length] = len;
                    changepayload[group.unit] = uni;

                    // Force SKU from current UI value (or original)
                    const skuChange = changedFields.find(c => c.field === `${warrantyKey} SKU` || c.field === (warrantyKey === "BrotherCare Warranty" ? "BrotherCare SKU" : warrantyKey === "BrotherPlus Warranty" ? "BrotherPlus SKU" : `${warrantyKey} SKU`));
                    const skuValue = skuChange ? skuChange.after : (originalData[group.sku] || "");

                    changepayload[group.sku] = (skuValue === "-" ? "" : skuValue);
                }
                // -------------------------------------------------
                // Order Type: always send flag + corresponding consumable together
                // -------------------------------------------------
                const orderGroupMap = {
                    "Drum Order": {
                        flagField: "Drum",
                        consumableField: "Drconsumable",
                        consumableLabel: "Drum Order Consumable"
                    },
                    "Waste Toner": {
                        flagField: "WasteToner",
                        consumableField: "Wtconsumable",
                        consumableLabel: "Waste Toner Consumable"
                    },
                    "Belt Unit": {
                        flagField: "BeltUnit",
                        consumableField: "Buconsumable",
                        consumableLabel: "Belt Unit Consumable"
                    },
                    "Backup Order": {
                        flagField: "Claimorder",
                        consumableField: "Coconsumable",
                        consumableLabel: "Backup Order Consumable"
                    }
                };

                // Detect which order group this change belongs to
                let orderKey = null;
                if (change.field === "Drum Order" || change.field === "Drum Order Consumable") orderKey = "Drum Order";
                if (change.field === "Waste Toner" || change.field === "Waste Toner Consumable") orderKey = "Waste Toner";
                if (change.field === "Belt Unit" || change.field === "Belt Unit Consumable") orderKey = "Belt Unit";
                if (change.field === "Backup Order" || change.field === "Backup Order Consumable") orderKey = "Backup Order";

                if (orderKey && orderGroupMap[orderKey]) {
                    const group = orderGroupMap[orderKey];

                    // ---- Flag (X or -) ----
                    const flagChange = changedFields.find(c =>
                        c.section === "Order Type" && c.field === orderKey
                    );
                    let flagValue;
                    if (flagChange) {
                        flagValue = flagChange.after === "Yes" ? "X" : "-";
                    } else {
                        // use original
                        flagValue = originalData[group.flagField] === "X" ? "X" : "-";
                    }
                    changepayload[group.flagField] = flagValue;

                    // ---- Consumable ----
                    const consumableChange = changedFields.find(c =>
                        c.section === "Order Type" && c.field === group.consumableLabel
                    );
                    let consumableValue;
                    if (consumableChange) {
                        consumableValue = consumableChange.after === "-" ? "" : consumableChange.after;
                    } else {
                        consumableValue = originalData[group.consumableField] || "";
                    }

                    // If flag is OFF, force consumable empty
                    if (flagValue === "-") {
                        consumableValue = "-";
                    }

                    changepayload[group.consumableField] = consumableValue;
                }

            });
            // =====================================================
            // Force related Pricing fields for Model Price Details
            // =====================================================
            const hasModelPriceChanges = changedFields.some(c =>
                c.section === "Pricing Information" &&
                c.subCategory === "Model Price Details"
            );

            if (hasModelPriceChanges) {

                // Always send the toggle
                const setupChange = changedFields.find(c =>
                    c.section === "Pricing Information" &&
                    c.subCategory === "Model Price Details" &&
                    c.field === "Model Price Setup"
                );
                changepayload.Selkzb1 = setupChange
                    ? (setupChange.after === "Yes" ? "X" : "")
                    : (originalData.Selkzb1 === "X" ? "X" : "");

                // Helper: get value from changedFields or fall back to original
                const getModelValue = (fieldName, backendKey) => {
                    const change = changedFields.find(c =>
                        c.section === "Pricing Information" &&
                        c.subCategory === "Model Price Details" &&
                        c.field === fieldName
                    );
                    return change ? change.after : (originalData[backendKey] || "");
                };

                // Force these fields (even if they were not changed)
                if (changepayload.B1konwa === undefined) {
                    changepayload.B1konwa = getModelValue("Currency", "B1konwa");
                }
                if (changepayload.B1kpein === undefined) {
                    changepayload.B1kpein = getModelValue("Pricing Unit", "B1kpein");
                }
                if (changepayload.B1kmein === undefined) {
                    changepayload.B1kmein = getModelValue("Unit Of Measure", "B1kmein") ||
                        getModelValue("Unit of Measure", "B1kmein");
                }
                if (changepayload.B1krech === undefined) {
                    changepayload.B1krech = getModelValue("Calculation Type", "B1krech");
                }
                // if (changepayload.B1datab === undefined) {
                //     const validFrom = getModelValue("Valid From", "B1datab");
                //     changepayload.B1datab = (validFrom && validFrom !== "-")
                //         ? convertToODataDate(validFrom)
                //         : (originalData.B1datab || null);
                // }
                // Condition Type (shared field Kschl)
                if (changepayload.Kschl === undefined) {
                    changepayload.Kschl = getModelValue("Condition Type", "Kschl") || (originalData.Kschl || "");
                }
            }

            // =====================================================
            // Force related Pricing fields for Consumable Price Details
            // =====================================================
            const hasConsumablePriceChanges = changedFields.some(c =>
                c.section === "Pricing Information" &&
                c.subCategory === "Consumable Price Details"
            );

            if (hasConsumablePriceChanges) {

                // Always send the toggle
                const setupChange = changedFields.find(c =>
                    c.section === "Pricing Information" &&
                    c.subCategory === "Consumable Price Details" &&
                    c.field === "Consumable Price Setup"
                );
                changepayload.Selkzbr = setupChange
                    ? (setupChange.after === "Yes" ? "X" : "")
                    : (originalData.Selkzbr === "X" ? "X" : "");

                // Helper
                const getConsumableValue = (fieldName, backendKey) => {
                    const change = changedFields.find(c =>
                        c.section === "Pricing Information" &&
                        c.subCategory === "Consumable Price Details" &&
                        c.field === fieldName
                    );
                    return change ? change.after : (originalData[backendKey] || "");
                };

                // Force these fields
                if (changepayload.Brkonwa === undefined) {
                    changepayload.Brkonwa = getConsumableValue("Currency", "Brkonwa");
                }
                if (changepayload.Brkpein === undefined) {
                    changepayload.Brkpein = getConsumableValue("Pricing Unit", "Brkpein");
                }
                if (changepayload.Brkmein === undefined) {
                    changepayload.Brkmein = getConsumableValue("Unit Of Measure", "Brkmein") ||
                        getConsumableValue("Unit of Measure", "Brkmein");
                }
                if (changepayload.Brkrech === undefined) {
                    changepayload.Brkrech = getConsumableValue("Calculation Type", "Brkrech");
                }
                // if (changepayload.Brdatab === undefined) {
                //     const validFrom = getConsumableValue("Valid From", "Brdatab");
                //     changepayload.Brdatab = (validFrom && validFrom !== "-")
                //         ? convertToODataDate(validFrom)
                //         : (originalData.Brdatab || null);
                // }
                // Customer Price Group
                if (changepayload.Konda === undefined) {
                    changepayload.Konda = getConsumableValue("Customer Price Group", "Konda");
                }
                // Condition Type (shared)
                if (changepayload.Kschl === undefined) {
                    changepayload.Kschl = getConsumableValue("Condition Type", "Kschl") || (originalData.Kschl || "");
                }
            }

            // Reset all flags
            changepayload.MaterialFlag = "";
            changepayload.PriceFlag = "";
            changepayload.WarrantyFlag = "";
            changepayload.OrdertypeFlag = "";
            changepayload.CompatableFlag = "";

            // Set flag based on changed section
            // Set flag based on changed section
            changedFields.forEach(change => {
                switch (change.section) {
                    case "Material Information":
                        changepayload.MaterialFlag = "X";
                        break;
                    case "Pricing Information":
                        changepayload.PriceFlag = "X";
                        break;
                    case "Warranty Information":
                        changepayload.WarrantyFlag = "X";
                        break;
                    case "Order Type":
                        changepayload.OrdertypeFlag = "X";
                        break;
                    case "Model Compatibility":
                        changepayload.CompatableFlag = "X";
                        break;
                }
            });

            try {

                console.log("Sending payload:");
                console.log(JSON.stringify(changepayload, null, 2));

                console.log("B1standardwarr =", changepayload.B1standardwarr);
                console.log("type =", typeof changepayload.B1standardwarr);

                const response = await fetch(
                    "/api/model/change",
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(changepayload)
                    }
                );

                const responseText = await response.text();

                console.log("Status:", response.status);
                console.log("Response:", responseText);

                if (!response.ok) {
                    throw new Error(responseText);
                }

                showUpdateSuccessPopup();

                changedFields = [];
                hasChanges = false;

                document.getElementById(
                    "reviewChangesBtn"
                )?.remove();

                if (
                    window.parent &&
                    typeof window.parent.closeModelChangeReview === "function"
                ) {

                    window.parent.closeModelChangeReview();
                }


                // alert("Model updated successfully");

                // changedFields = [];
                // hasChanges = false;

                const reviewBtn = document.getElementById("reviewChangesBtn");

                if (reviewBtn) {
                    reviewBtn.remove();
                }



            } catch (error) {

                console.error("Update Failed", error);

                alert(error.message);
            }

        }
        function formatODataDate(dateStr) {

            if (!dateStr) return "-";

            const timestamp = parseInt(
                dateStr.match(/\d+/)[0]
            );

            const date = new Date(timestamp);

            return date.toLocaleDateString("en-GB");
        }

        function saveSection(icon) {

            const section =
                icon.closest(".change-section");

            const sectionName =
                section.querySelector("h3").innerText;

            const toggle =
                section.querySelector(".toggle-icon");

            toggle.style.display = "flex";
            // ===== Validate SW + EW total before accepting the section =====
            if (sectionName === "Warranty Information") {
                // Temporarily put the values back so validation can read them
                // (or call validate while the inputs still exist – easiest is to call it before converting)

                // Call validation BEFORE converting the groups to spans
                if (!validateSwEwTotal()) {
                    // Keep the section in edit mode – do not save
                    alert("Please fix the Standard + Extended Warranty total (must be 3 years).");
                    return;   // stop saveSection
                }
            }

            const warrantyGroups =
                section.querySelectorAll(".warranty-group");

            warrantyGroups.forEach(group => {

                const num =
                    group.querySelector(".warranty-number")?.value;

                const unit =
                    group.querySelector(".warranty-unit")?.value;

                const value =
                    num
                        ? `${num} ${unit}`
                        : "-";

                group.outerHTML =
                    `<span class="field-value">${value}</span>`;
            });

            const controls =
                section.querySelectorAll("input, select");

            controls.forEach(control => {

                if (control.type === "checkbox") {

                    if (sectionName === "Warranty Information" ||
                        sectionName === "Model Compatibility" ||
                        sectionName === "Pricing Information" ||
                        sectionName === "Order Type") {

                        const checked = control.checked ? "checked" : "";
                        const toggleLabel = control.dataset.toggleLabel || "";
                        const isWarranty = sectionName === "Warranty Information";
                        const isPricing = sectionName === "Pricing Information";

                        const wrapper = control.closest(".switch-wrapper");

                        if (wrapper) {
                            // Keep data-toggle-label + onchange so the second edit still works
                            const dataAttr = toggleLabel ? `data-toggle-label="${toggleLabel}"` : "";

                            let onChangeAttr = "";
                            if (isWarranty && toggleLabel) {
                                onChangeAttr = `onchange="handleWarrantyToggle(this)"`;
                            } else if (isPricing && toggleLabel) {
                                onChangeAttr = `onchange="togglePricingBlock(this,'${toggleLabel}')"`;
                            }

                            wrapper.outerHTML = `
      <div class="switch-wrapper">
        <label class="switch">
          <input type="checkbox"
                 ${checked}
                 disabled
                 ${dataAttr}
                 ${onChangeAttr}>
          <span class="slider"></span>
        </label>
      </div>
    `;
                        }
                    } else {

                        const value =
                            control.checked
                                ? "Yes"
                                : "No";

                        const wrapper =
                            control.closest(".switch-wrapper");

                        if (wrapper) {
                            wrapper.outerHTML =
                                `<span class="field-value">${value}</span>`;
                        }
                    }

                    return;
                }

                let value =
                    (control.value || "").trim() || "-";

                if (
                    control.type === "date" &&
                    value !== "-"
                ) {

                    const [year, month, day] =
                        value.split("-");

                    value =
                        `${day}/${month}/${year}`;
                }

                control.outerHTML =
                    `<span class="field-value">${value}</span>`;
            });

            const fields =
                section.querySelectorAll(".info-field");

            let hasAnyChange = false;

            if (sectionName === "Model Compatibility") {

                const compatibilityChecks = [
                    { id: "basic", field: "Basic" },
                    { id: "occasional", field: "Occasional" },
                    { id: "moderate", field: "Moderate" },
                    { id: "frequent", field: "Frequent" },
                    { id: "high", field: "High" },
                    { id: "power", field: "Power" }
                ];

                compatibilityChecks.forEach(item => {

                    const checkbox =
                        section.querySelector(`#${item.id}`);

                    if (!checkbox) return;

                    const currentValue =
                        checkbox.checked ? "Yes" : "No";

                    const backendField =
                        fieldMap[item.field];

                    const originalValue =
                        originalData[backendField] === "X"
                            ? "Yes"
                            : "No";

                    const existingIndex =
                        changedFields.findIndex(x =>
                            x.section === "Model Compatibility" &&
                            x.field === item.field
                        );

                    if (originalValue !== currentValue) {

                        hasAnyChange = true;

                        if (existingIndex > -1) {

                            changedFields[existingIndex].after =
                                currentValue;

                        } else {

                            changedFields.push({
                                section: "Model Compatibility",
                                subCategory: "-",
                                field: item.field,
                                before: originalValue,
                                after: currentValue
                            });
                        }

                    } else if (existingIndex > -1) {

                        changedFields.splice(existingIndex, 1);
                    }

                });
            }

            fields.forEach(field => {

                const label =
                    field.querySelector("label")?.innerText?.trim();

                if (!label) return;

                let currentValue = "-";

                const valueField =
                    field.querySelector(".field-value");

                const toggleField =
                    field.querySelector('input[type="checkbox"]');

                if (toggleField) {

                    currentValue =
                        toggleField.checked
                            ? "Yes"
                            : "No";

                } else if (valueField) {

                    currentValue =
                        valueField.innerText?.trim() || "-";
                }

                let subCategory = "-";

                const subBlock =
                    field.closest(".pricing-sub-block");

                if (subBlock) {

                    subCategory =
                        subBlock.querySelector(".pricing-sub-block-title")
                            ?.innerText?.trim() || "-";
                }

                const originalKeys =
                    JSON.parse(section.dataset.originalKeys || "[]");

                const originalValues =
                    JSON.parse(section.dataset.originalValues || "[]");

                let key =
                    subCategory + "||" + label;

                if (sectionName === "Order Type") {
                    key = "-||" + label;
                }

                const keyIndex =
                    originalKeys.indexOf(key);

                const originalValue =
                    keyIndex > -1
                        ? (originalValues[keyIndex] || "-")
                        : currentValue;

                console.log({
                    sectionName,
                    label,
                    key,
                    keyIndex,
                    originalValue,
                    currentValue
                });

                const existingIndex =
                    changedFields.findIndex(x =>
                        x.section === sectionName &&
                        x.field === label &&
                        (x.subCategory || "-") === subCategory
                    );

                if (originalValue !== currentValue) {

                    hasAnyChange = true;

                    if (existingIndex > -1) {

                        changedFields[
                            existingIndex
                        ].after = currentValue;

                    } else {

                        changedFields.push({
                            section: sectionName,
                            subCategory: subCategory,
                            field: label,
                            before: originalValue,
                            after: currentValue
                        });
                    }

                } else {

                    if (existingIndex > -1) {
                        changedFields.splice(existingIndex, 1);
                    }
                }
            });

            if (hasAnyChange) {
                markAsChanged();
            }

            icon.innerHTML =
                '<i class="fas fa-pen-to-square"></i>';

            icon.onclick = function () {
                enableEdit(this);
            };

            console.log("Section Saved");
            console.log("changedFields =", changedFields);
        }

    </script>
