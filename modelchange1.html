<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Model Change</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: transparent;
      color: #e2e8f0;
      height: 100%;
      margin: 0;
      padding: 24px;
      min-height: 100%;
      overflow-y: auto;
    }

    .container {
      width: 100%;
      max-width: 100%;
      min-height: auto;
    }

    .report-header {
      margin-bottom: 20px;
    }

    .report-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .report-header p {
      font-size: 13px;
      color: #94a3b8;
    }

    .report-search-card {
      background: #162238;
      border: 1px solid #243b55;
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 20px;
      display: flex;
      gap: 14px;
      align-items: end;
      flex-wrap: wrap;
    }

    .report-search-card .form-field {
      flex: 1;
      min-width: 180px;
    }

    .report-search-card label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .report-search-card input {
      width: 100%;
      padding: 11px 14px;
      background: #0f1c2e;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 13.5px;
      outline: none;
      box-sizing: border-box;
    }

    .report-search-card input:focus {
      border-color: #2563eb;
    }

    .report-search-card select {
      width: 100%;
      padding: 11px 14px;
      background: #0f1c2e;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 13.5px;
      outline: none;
      appearance: none;
    }

    .report-search-card select:focus {
      border-color: #2563eb;
    }

    .report-search-actions {
      display: flex;
      gap: 10px;
    }

    .btn-search {
      background: #2563eb;
      color: white;
      border: none;
      padding: 11px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 8px;
    }


    .btn-search:hover {
      background: #1d4ed8;
    }

    .btn-reset {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 13.5px;
      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, .05);
      color: #e2e8f0;
    }

    /* building blcks */
    .change-section {
      background: #162238;
      border: 1px solid #243b55;
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 12px;
    }

    .change-section:hover {
      border-color: #2f6df6;
    }

    .change-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .change-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .change-content {
      min-height: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      margin-top: 12px;
      padding-top: 12px;
    }

    .edit-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(37, 99, 235, .12);

      display: flex;
      align-items: center;
      justify-content: center;

      color: #60a5fa;
      cursor: pointer;
      transition: .2s ease;
    }

    .edit-icon:hover {
      background: #2563eb;
      color: white;
    }

    .edit-icon.save-mode {
      color: #22c55e;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(37, 99, 235, .12);

      display: flex;
      align-items: center;
      justify-content: center;

      color: #60a5fa;
      cursor: pointer;
      transition: .2s ease;
    }

    .toggle-icon:hover {
      background: #2563eb;
      color: #fff;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .info-field {
      display: flex;
      flex-direction: column;
    }

    .info-field label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .info-field input {
      width: 100%;
      height: 34px;
      padding: 0 12px;
      background: #0f1c2e;
      border: 1px solid #d6dff3;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }

    .info-field input:focus {
      border-color: #ffffff;
    }



    @media(max-width:1200px) {
      .info-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width:768px) {
      .info-grid {
        grid-template-columns: 1fr;
      }
    }

    .display-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-size: 12px;
      color: #94a3b8;
    }

    .field-value {
      font-size: 15px;
      color: #f8fafc;
      font-weight: 500;
      min-height: 24px;
      display: block;
    }

    .info-field select {
      width: 100%;
      height: 34px;
      padding: 0 12px;
      background: #0f1c2e;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }

    .info-field select:focus {
      border-color: #ffffff;
    }

    .warranty-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .warranty-number {
      flex: 1;
      min-width: 220px;
    }

    .warranty-unit {
      flex: 0 0 90px;
      min-width: 90px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 30px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #374151;
      transition: .3s;
      border-radius: 30px;
    }

    .slider:before {
      position: absolute;
      content: "";
      width: 22px;
      height: 22px;
      left: 4px;
      bottom: 4px;
      background: white;
      transition: .3s;
      border-radius: 50%;
    }

    .switch input:checked+.slider {
      background: #3b82f6;
    }

    .switch input:checked+.slider:before {
      transform: translateX(26px);
    }

    .toggle-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .toggle-grid .info-field {
      display: grid;

      grid-template-columns:
        170px 70px;

      align-items: center;

      column-gap: 24px;
    }

    .toggle-grid .info-field label {
      margin: 0;
      font-size: 13px;
    }

    .toggle-grid .switch {
      margin: 0;
    }

    .switch-wrapper {
      display: flex;
      align-items: center;
    }

    .review-container {
      display: flex;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .btn-review {
      background: #f59e0b;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-review:hover {
      background: #d97706;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header (words unchanged) -->
    <div class="report-header">
      <h1>Model Change</h1>
      <p>Search and update model configuration details.</p>
    </div>

    <!-- Search Section - now matches Model Report -->
    <div class="report-search-card">

      <div class="form-field">
        <label>Model</label>
        <input type="text" id="changeModelSearch" placeholder="e.g. DCPL2550DW">
      </div>

      <div class="form-field">
        <label>Country</label>
        <input type="text" id="changeCountrySearch" placeholder="e.g. US">
      </div>

      <div class="form-field">
        <label>Search Type</label>

        <select id="searchType">
          <option value="full">Full Details</option>
          <option value="material">Material Info</option>
          <option value="warranty">Warranty Info</option>
          <option value="compatibility">Model Compatibility</option>
          <option value="pricing">Pricing Info</option>
          <option value="order">Order Info</option>
        </select>
      </div>

      <div class="report-search-actions">

        <button class="btn-search" onclick="loadModelChange()">
          <i class="fas fa-search"></i>
          Search
        </button>

        <button class="btn-reset" onclick="resetModelChange()">
          <i class="fas fa-undo"></i>
          Reset
        </button>

      </div>

    </div>

    <div id="modelChangeResult"></div>
  </div>

  <script>

    let originalData = null;
    let hasChanges = false;

    async function loadModelChange() {
      console.log("Search button clicked");

      const model =
        document.getElementById("changeModelSearch")
          .value.trim();

      const country =
        document.getElementById("changeCountrySearch")
          .value.trim();

      const searchType =
        document.getElementById("searchType").value;

      console.log("Model:", model);
      console.log("Country:", country);

      if (!model || !country) {
        alert("Please enter Model and Country");
        return;
      }
      try {
        const response = await fetch(
          `/api/model?model=${encodeURIComponent(model)}&country=${encodeURIComponent(country)}`
        );

        console.log("API called");
        const data = await response.json();
        console.log("Response:", data);
        const record = data.d;
        console.log("FIRST RECORD");
        console.log(record);

        if (!record) {

          document.getElementById("modelChangeResult")
            .innerHTML =
            "<div>No data found</div>";
          return;
        }

        originalData =
          JSON.parse(JSON.stringify(record));

        hasChanges = false;

        const oldBtn =
          document.getElementById("reviewChangesBtn");

        if (oldBtn) {
          oldBtn.remove();
        }
        showChangeBlocks(record, searchType);
      }
      catch (error) {
        console.error("Search Error:", error);
        alert(error.message || "Search failed");
      }
    }
    function resetModelChange() {

      document.getElementById(
        "changeModelSearch"
      ).value = "";

      document.getElementById(
        "changeCountrySearch"
      ).value = "";

      document.getElementById(
        "searchType"
      ).value = "full";

      document.getElementById(
        "modelChangeResult"
      ).innerHTML = "";
    }

    function enableEdit(icon) {

      const section =
        icon.closest(".change-section");

      section.dataset.originalValues =
        JSON.stringify(
          Array.from(
            section.querySelectorAll(".field-value")
          ).map(x => x.innerText)
        );

      const toggle =
        section.querySelector(".toggle-icon");

      toggle.style.display = "none";

      const displayFields =
        section.querySelectorAll(".field-value");

      displayFields.forEach(field => {

        const value =
          field.innerText === "-"
            ? ""
            : field.innerText;

        const label = field.closest(".info-field").querySelector("label").innerText;

        const yesNoFields = [

          "StandardWarranty",
          "ExtendedWarranty",
          "BrothercareWarranty",
          "BrotherplusWarranty",

          "Amazon Dart",
          "BR Refresh",
          "Barracuda",
          "Brother Plus",

          "B1 Price Setup",
          "BR Price Setup",

          "Backup Order",
          "Drum Order",
          "Waste Toner",
          "Belt Unit",
          "Claim Order"

        ];

        const warrantyFields = [

          "StandardwarrantyLength",
          "ExtendedwarrantyLength",
          "BrothercarewarrantyLength",
          "BrotherpluswarrantyLength"

        ];
        if (warrantyFields.includes(label)) {

          let numValue = "";
          let unitValue = "YR";

          if (value) {

            const parts = value.split(" ");

            numValue = parts[0] || "";
            unitValue = parts[1] || "YR";
          }

          field.outerHTML = `
        <div class="warranty-group">

            <input
                class="warranty-number"
                type="number"
                min="0"
                value="${numValue}">

            <select class="warranty-unit">

                <option value="YR"
                    ${unitValue === "YR" ? "selected" : ""}>
                    YR
                </option>

                <option value="MONTH"
                    ${unitValue === "MONTH" ? "selected" : ""}>
                    Month
                </option>

            </select>

        </div>
    `;

        }
        else if (yesNoFields.includes(label)) {

          const checked =
            value === "Yes"
              ? "checked"
              : "";

          field.outerHTML = `
<div class="switch-wrapper">
    <label class="switch">
        <input type="checkbox" ${checked}>
        <span class="slider"></span>
    </label>
</div>
`;
        } else {
          field.outerHTML =
            `<input type="text" value="${value}">`;
        }
      });

      icon.innerHTML =
        '<i class="fas fa-check"></i>';

      icon.onclick = function () {
        saveSection(this);
      };
    }
    function saveSection(icon) {

      const section =
        icon.closest(".change-section");
      const toggle =
        section.querySelector(".toggle-icon");

      toggle.style.display = "flex";

      const warrantyGroups =
        section.querySelectorAll(".warranty-group");

      warrantyGroups.forEach(group => {

        const num =
          group.querySelector(".warranty-number").value;

        const unit =
          group.querySelector(".warranty-unit").value;

        const value =
          num
            ? `${num} ${unit}`
            : "-";

        group.outerHTML =
          `<span class="field-value">${value}</span>`;
      });

      const controls =
        section.querySelectorAll("input, select");

      controls.forEach(control => {
        if (control.type === "checkbox") {

          const value =
            control.checked
              ? "Yes"
              : "No";

          control.closest(".switch").outerHTML =
            `<span class="field-value">${value}</span>`;

          return;
        }

        const value =
          (control.value || "").trim() || "-";

        control.outerHTML =
          `<span class="field-value">${value}</span>`;
      });
      const originalValues =
        JSON.parse(
          section.dataset.originalValues || "[]"
        );

      const currentValues =
        Array.from(
          section.querySelectorAll(".field-value")
        ).map(x => x.innerText);

      const changed =
        JSON.stringify(originalValues) !==
        JSON.stringify(currentValues);

      if (changed) {
        markAsChanged();
      }
      icon.innerHTML =
        '<i class="fas fa-pen-to-square"></i>';

      icon.onclick = function () {
        enableEdit(this);
      };

      console.log("Section Saved");
    }
    function markAsChanged() {

      if (hasChanges) return;

      hasChanges = true;

      showReviewButton();
    }
    function showReviewButton() {

      const existing =
        document.getElementById("reviewChangesBtn");

      if (existing) return;

      document
        .getElementById("modelChangeResult")
        .insertAdjacentHTML(
          "beforeend",
          `
      <div class="review-container">

        <button
          id="reviewChangesBtn"
          class="btn-review">

          <i class="fas fa-eye"></i>
          Review Changes

        </button>

      </div>
      `
        );
    }
    function toggleSection(btn) {

      const section =
        btn.closest(".change-section");

      const content =
        section.querySelector(".change-content");

      const icon =
        btn.querySelector("i");

      if (content.style.display === "none") {

        content.style.display = "block";

        icon.className =
          "fas fa-chevron-up";

      } else {

        content.style.display = "none";

        icon.className =
          "fas fa-chevron-down";
      }
    }
    function showChangeBlocks(record, searchType) {

      originalData = JSON.parse(JSON.stringify(record)); //Store the Original data

      const showMaterial =
        searchType === "full" ||
        searchType === "material";

      const showWarranty =
        searchType === "full" ||
        searchType === "warranty";

      const showCompatibility =
        searchType === "full" ||
        searchType === "compatibility";

      const showPricing =
        searchType === "full" ||
        searchType === "pricing";

      const showOrder =
        searchType === "full" ||
        searchType === "order";
      ``
      document.getElementById("modelChangeResult").innerHTML = `
${showMaterial ? `
<div class="change-section">
    <div class="change-header">
    <h3>Material Information</h3>
         <div class="header-actions">
             
              <div class="edit-icon" onclick="enableEdit(this)">
                <i class="fas fa-pen-to-square"></i>
              </div>

              <div class="toggle-icon"
              onclick="toggleSection(this)">
              <i class="fas fa-chevron-up"></i>
             </div>

           </div>
     </div>

    <div class="change-content">
        <div class="info-grid">

            <div class="info-field">
                <label>Model</label>
               <span class="field-value">${record.Matnr || "-"}</span>
            </div>

            <div class="info-field">
                <label>Country</label>
               <span class="field-value">${record.Country || "-"}</span>
            </div>

            <div class="info-field">
                <label>Ean11</label>
               <span class="field-value">${record.Ean11 || "-"}</span>
            </div>

            <div class="info-field">
                <label>Material Type</label>
               <span class="field-value">-</span>
            </div>

            <div class="info-field">
                <label>Material Group</label>
               <span class="field-value">-</span>
            </div>

            <div class="info-field">
                <label>Base Unit</label>
               <span class="field-value">-</span>
            </div>

            <div class="info-field">
                <label>Sales Organization</label>
              <span class="field-value">-</span>
            </div>

            <div class="info-field">
                <label>Division</label>
               <span class="field-value">-</span>
            </div>

            <div class="info-field">
                <label>Distribution</label>
               <span class="field-value">-</span>
            </div>

        </div>
    </div>
</div>
` : ''}


${showWarranty ? `
<div class="change-section">
    <div class="change-header">
        <h3>Warranty Information</h3>
       <div class="header-actions">
            
              <div class="edit-icon" onclick="enableEdit(this)">
                <i class="fas fa-pen-to-square"></i>
              </div>
              <div class="toggle-icon"
              onclick="toggleSection(this)">
              <i class="fas fa-chevron-up"></i>
             </div>

           </div>
    </div>

    <div class="change-content">
        <div class="info-grid">

            <div class="info-field">
                <label>StandardWarranty</label>
                <span class="field-value">${record.StandardWarranty === "X" ? "Yes" : "No"}</span>
            </div>

            <div class="info-field">
                <label>StandardwarrantyLength</label>
                <span class="field-value">${record.StandardwarrantyLength || "-"} ${record.StandardwarrantyUnit || ""}</span>
            </div>

            <div class="info-field">
                <label>ExtendedWarranty</label>
                <span class="field-value">${record.ExtendedWarranty === "X" ? "Yes" : "No"}</span>
            </div>

            <div class="info-field">
                <label>ExtendedwarrantyLength</label>
                <span class="field-value">${record.ExtendedwarrantyLength || "-"} ${record.ExtendedwarrantyUnit || ""}</span>
            </div>

            <div class="info-field">
                <label>BrothercareWarranty</label>
                <span class="field-value">${record.BrothercareWarranty === "X" ? "Yes" : "No"}</span>
            </div>

            <div class="info-field">
                <label>BrothercarewarrantyLength</label>
                <span class="field-value">${record.BrothercarewarrantyLength || "-"} ${record.BrothercarewarrantyUnit || ""}</span>
            </div>

            <div class="info-field">
                <label>BrotherplusWarranty</label>
                <span class="field-value">${record.BrotherplusWarranty === "X" ? "Yes" : "No"}</span>
            </div>

            <div class="info-field">
                <label>BrotherpluswarrantyLength</label>
                <span class="field-value">${record.BrotherpluswarrantyLength || "-"} ${record.BrotherpluswarrantyUnit || ""}</span>
            </div>

        </div>
    </div>
</div>
` : ''}


${showCompatibility ? `
<div class="change-section">
    <div class="change-header">
        <h3>Model Compatibility</h3>
        <div class="header-actions">
            
              <div class="edit-icon" onclick="enableEdit(this)">
                <i class="fas fa-pen-to-square"></i>
              </div>

              <div class="toggle-icon"
              onclick="toggleSection(this)">
              <i class="fas fa-chevron-up"></i>
             </div>

           </div>
    </div>

    <div class="change-content">
        <div class="toggle-grid">

            <div class="info-field">
                <label>Amazon Dart</label>
                <span class="field-value">${record.Amazondart === "X" ? "Yes" : "No"}</span>
            </div>

            <div class="info-field">
                <label>BR Refresh</label>
                <span class="field-value">${record.Brrefresh === "X" ? "Yes" : "No"}</span>
            </div>

            <div class="info-field">
                <label>Barracuda</label>
                <span class="field-value">${record.Barracuda === "X" ? "Yes" : "No"}</span>
            </div>

            <div class="info-field">
                <label>Brother Plus</label>
                <span class="field-value">${record.Bplus === "X" ? "Yes" : "No"}</span>
            </div>

        </div>
    </div>
</div>
` : ''}

${showPricing ? `
<div class="change-section">
    <div class="change-header">
        <h3>Pricing Information</h3>
       <div class="header-actions">
             
              <div class="edit-icon" onclick="enableEdit(this)">
                <i class="fas fa-pen-to-square"></i>
              </div>
              <div class="toggle-icon"
              onclick="toggleSection(this)">
              <i class="fas fa-chevron-up"></i>
             </div>

           </div>
    </div>

    <div class="change-content">
        <div class="toggle-grid">

            <div class="info-field">
                <label>B1 Price Setup</label>
                <span class="field-value">${record.B1priceSetup === "X" ? "Yes" : "No"}</span>
            </div>

            <div class="info-field">
                <label>BR Price Setup</label>
                <span class="field-value">${record.BrpriceSetup === "X" ? "Yes" : "No"}</span>
            </div>

        </div>
    </div>
</div>
` : ''}

${showOrder ? `
<div class="change-section">
    <div class="change-header">
